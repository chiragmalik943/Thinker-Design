.dbar{display:flex;align-items:center;gap:var(--s2);padding:12px var(--bp,28px);border-top:1px solid var(--line);background:var(--surf);flex:0 0 auto;margin:0 calc(-1*var(--bp,28px)) calc(-1*var(--bp,28px));flex-wrap:wrap}
.dbar .sp-l{margin-right:auto;font-size:12.5px;color:var(--sec)}
.win.w0 .dbar{padding:10px var(--bp,16px) calc(12px + env(safe-area-inset-bottom,0px))}
.win.w0 .dbar .btn{flex:1 1 40%;height:44px}
.win.w0 .dbar .sp-l{display:none}
.att{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-top:1px solid var(--hair)}
.att:first-child{border-top:0}
.att .bd{flex:1;min-width:0}
.att .bd b{display:block;font-size:13.5px;font-weight:500;color:var(--ink)}
.att .bd span{font-size:12px;color:var(--ter)}
.cmt{display:flex;gap:var(--s3);padding:var(--s4) 0;border-top:1px solid var(--hair)}
.cmt:first-child{border-top:0;padding-top:0}
.cmt p{font-size:13.5px;line-height:1.6;color:var(--ink2);margin-top:4px}
.cmt .who{font-size:13px;font-weight:600}
.cmt .who small{font-weight:400;color:var(--ter);margin-left:6px}

/* ── compare / split ── */
.cmp2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);flex:1;min-height:0;gap:0;border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;background:var(--surf)}
.cmp2>.pn{display:flex;flex-direction:column;min-width:0;min-height:0}
.cmp2>.pn+.pn{border-left:1px solid var(--line)}
.cmp2 .ph{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s4);border-bottom:1px solid var(--line);background:var(--rail);flex:0 0 auto}
.cmp2 .ph b{font-family:var(--f-head);font-size:14px;font-weight:600}
.cmp2 .ph span{font-size:12px;color:var(--ter)}
.cmp2 .ph .r{margin-left:auto;display:flex;gap:2px}
.cmp2 .pb{flex:1;min-height:0;overflow:auto;padding:var(--s2) 0}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 54px 84px;gap:var(--s3);padding:10px var(--s4);border-bottom:1px solid var(--hair);font-size:13px;align-items:center;position:relative}
.lrow .nm b{display:block;font-weight:500;color:var(--ink)}
.lrow .nm span{font-size:12px;color:var(--ter)}
.lrow .q,.lrow .am{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.lrow.chg{background:var(--warnTint)}
.lrow.chg .am,.lrow.chg .q{font-weight:700;color:var(--warnInk)}
.lrow.add{background:var(--okTint)}
.lrow.del{background:var(--dangerTint)}
.lrow.del .nm b{text-decoration:line-through;color:var(--sec)}
.lrow .flg{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--warn)}
.lrow.add .flg{background:var(--ok)}.lrow.del .flg{background:var(--danger)}
.cmpsum{display:flex;align-items:center;gap:var(--s4);padding:12px var(--s4);border-top:1px solid var(--line);flex:0 0 auto;font-size:13px;color:var(--sec);flex-wrap:wrap}
.cmpsum b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.cmpsum .r{margin-left:auto;display:flex;gap:var(--s2)}
.win.w1 .cmp2,.win.w0 .cmp2{grid-template-columns:minmax(0,1fr)}
.win.w1 .cmp2>.pn+.pn,.win.w0 .cmp2>.pn+.pn{border-left:0;border-top:1px solid var(--line)}
.win.w0 .cmp2.one>.pn:not(.on){display:none}
.win.w0 .lrow{grid-template-columns:minmax(0,1fr) 40px 74px;padding:10px var(--s3)}

/* ── settings as a page, and other sub-navigated pages ── */
.setp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s7);align-items:start}
.win.w1 .setp,.win.w0 .setp{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
.setp>.snav{display:flex;flex-direction:column;gap:1px;position:sticky;top:0}
.setp>.snav .gl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);padding:var(--s4) 10px 5px}
.setp>.snav .gl:first-child{padding-top:0}
.setp>.snav a{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r2);color:var(--ink2);font-size:13px;cursor:pointer}
.setp>.snav a:hover{background:var(--sunk)}
.setp>.snav a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.setp>.snav a .ic{color:var(--ter)}.setp>.snav a.on .ic{color:var(--brandInk)}
.win.w1 .setp>.snav,.win.w0 .setp>.snav{flex-direction:row;overflow-x:auto;position:static;gap:var(--s2);scrollbar-width:none;margin:0 calc(-1*var(--bp));padding:0 var(--bp)}
.win.w1 .setp>.snav .gl,.win.w0 .setp>.snav .gl{display:none}
.win.w1 .setp>.snav a,.win.w0 .setp>.snav a{flex:0 0 auto;border:1px solid var(--line);border-radius:var(--rF);height:34px}
.win.w1 .setp>.snav a.on,.win.w0 .setp>.snav a.on{border-color:var(--tint)}
.setp .spane{max-width:720px;display:flex;flex-direction:column;gap:var(--s7)}
.setp .spane>h2{font-family:var(--f-head);font-size:22px;font-weight:600;letter-spacing:-.018em}
.setp .spane>.lede{font-size:13.5px;color:var(--sec);line-height:1.6;margin-top:-18px}

/* ── account (consumer) ── */
.acc{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--s8);align-items:start}
.win.w1 .acc,.win.w0 .acc{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
.acc>.snav{display:flex;flex-direction:column;gap:2px}
.acc>.snav .me{display:flex;align-items:center;gap:var(--s3);padding:0 0 var(--s4);margin-bottom:var(--s2);border-bottom:1px solid var(--hair)}
.acc>.snav .me .avat{width:44px;height:44px;font-size:17px}
.acc>.snav .me b{display:block;font-size:14px;font-weight:600}.acc>.snav .me span{font-size:12px;color:var(--ter)}
.acc>.snav a{display:flex;align-items:center;gap:var(--s3);height:38px;padding:0 var(--s3);border-radius:var(--r2);font-size:13.5px;color:var(--ink2);cursor:pointer}
.acc>.snav a:hover{background:var(--sunk)}
.acc>.snav a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.acc>.snav a .ic{color:var(--ter)}.acc>.snav a.on .ic{color:var(--brandInk)}
.win.w1 .acc>.snav,.win.w0 .acc>.snav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:var(--s2)}
.win.w1 .acc>.snav .me,.win.w0 .acc>.snav .me{display:none}
.win.w1 .acc>.snav a,.win.w0 .acc>.snav a{flex:0 0 auto;border:1px solid var(--line);border-radius:var(--rF);height:36px}
.ord{border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;background:var(--surf)}
.ord+.ord{margin-top:var(--s4)}
.ord .oh{display:flex;gap:var(--s6);padding:12px var(--s4);background:var(--rail);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--sec);flex-wrap:wrap;align-items:center}
.ord .oh b{display:block;color:var(--ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.ord .oh .r{margin-left:auto;display:flex;gap:var(--s2)}
.ord .ol{display:flex;gap:var(--s3);padding:14px var(--s4);align-items:center}
.ord .ol+.ol{border-top:1px solid var(--hair)}
.ord .ol .th{width:56px;height:56px;border-radius:var(--r3);background:var(--cT);color:var(--cI);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ord .ol .bd{flex:1;min-width:0}
.ord .ol .bd b{display:block;font-size:13.5px;font-weight:600}
.ord .ol .bd span{font-size:12.5px;color:var(--ter)}
.ord .ol .st{font-size:12.5px;display:flex;align-items:center;gap:6px}
.track{display:flex;gap:0;margin:0;padding:var(--s3) var(--s4) var(--s4)}
.track .ts{flex:1;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ter);position:relative;padding-top:14px}
.track .ts:before{content:'';position:absolute;top:4px;left:0;right:0;height:2px;background:var(--line)}
.track .ts:after{content:'';position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--surf);box-shadow:inset 0 0 0 2px var(--line2)}
.track .ts.done:before{background:var(--okInk)}.track .ts.done:after{background:var(--okInk);box-shadow:none}
.track .ts.on:after{box-shadow:inset 0 0 0 3px var(--brand)}
.track .ts b{color:var(--ink2);font-weight:600;font-size:12px}
.track .ts:last-child:before{right:60%}

/* ── order / user detail extras ── */
.li{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-top:1px solid var(--hair)}
.li:first-child{border-top:0}
.li .th{width:40px;height:40px;border-radius:var(--r2);background:var(--cT);color:var(--cI);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.li .bd{flex:1;min-width:0}
.li .bd b{display:block;font-size:13px;font-weight:600}.li .bd span{font-size:12px;color:var(--ter)}
.li .am{font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.sumline{display:flex;justify-content:space-between;font-size:13px;color:var(--sec);padding:3px 0;font-variant-numeric:tabular-nums}
.sumline.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;color:var(--ink);font-weight:600;font-size:14px}
.perm{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,64px);align-items:center;gap:var(--s2);padding:8px 0;border-top:1px solid var(--hair);font-size:13px}
.perm:first-child{border-top:0}
.perm.hd{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);border-top:0}
.perm .c{display:flex;justify-content:center}

/* ── a placeholder image for product and file tiles ── */
.pimg.c1,.pimg.c2,.pimg.c3,.pimg.c4,.pimg.c5,.pimg.c6{background:var(--cT);color:var(--cI)}

/* ── width-dependent structure: some screens change shape, not just size ── */
.only-m{display:none}
.win.w0 .only-m{display:block}
.win.w0 .seg.only-m{display:inline-flex}
.win.w0 .no-m{display:none!important}
.shell.m[data-screen="detail"]>.bnav{display:none}
.shell.m .scr>.mdet,.shell.m .scr>.mlist{flex:1 1 auto;min-height:0;border-right:0}
.shell.m .scr>.mlist .ml{padding-bottom:var(--s3)}
.seg small.wpx{font-size:11px;font-weight:500;color:var(--ter);margin-left:5px;font-variant-numeric:tabular-nums}
.seg span.on small.wpx{color:inherit;opacity:.65}
@media (max-width:640px){.seg small.wpx{display:none}}

.win.w0 .dt>.tabs{margin:0;padding:var(--s1) var(--s3) 0}
.win.w0 .mon.only-m{display:grid}
.win.w0 .agenda.only-m{display:flex}
.win.w0 .chiprow,.win.w0 .tbar.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1*var(--bp,16px));padding-right:var(--bp,16px)}
.win.w0 .chiprow::-webkit-scrollbar{display:none}
.win.w0 .chiprow>*{flex:0 0 auto}
.win.w0 .chiprow>.r{margin-left:auto}
.dbar.flush{margin-bottom:0}
.win.w0 .dbar.flush{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.win.w0 .dbar.flush .btn.p{grid-column:1/-1;order:-1}
.win.w0 .dbar.flush .btn{flex:none}
@container dt (max-width:560px){.dtbar .tt{justify-content:flex-start}.dtbar:not(.bulk) .fill{display:none}}

/* the settings dialog on a phone: full screen, navigation as a row of pills above one pane */
.win.w0 .modal.st{left:0;top:0;transform:none;width:100%!important;height:100%!important;max-width:none;max-height:none;border-radius:0;flex-direction:column}
.win.w0 .modal.st .mnav{display:flex;width:auto;flex-direction:row;overflow-x:auto;padding:var(--s3) var(--s3);gap:var(--s2);border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;order:0}

.dsfoot{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ter);flex-wrap:wrap}
.copied{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300}

/* showcase shell — responsive (viewport, not window) */
@media (max-width:1180px){
  #ds .app>.listcol{width:236px;flex-basis:236px}
  .hero-in>h1{font-size:38px}
  .hero-mode{display:none}
}
@media (max-width:900px){
  .menubtn{display:flex}
  #ds>.shell>.app>.rail,#ds>.shell>.app>.listcol{position:absolute;left:0;z-index:30;width:min(300px,86vw);flex-basis:auto;transform:translateX(-105%);transition:transform var(--sbT);box-shadow:var(--peekShadow)}
  #ds>.shell>.app>.rail{top:0;bottom:auto;height:auto;padding-bottom:10px;border-bottom:1px solid var(--line)}
  #ds>.shell>.app>.rail .spacer,#ds>.shell>.app>.rail .colbtn,#ds>.shell>.app>.rail .acct{display:none}
  #ds>.shell>.app>.listcol{top:var(--dh,280px);bottom:0}
  #ds>.shell>.app.drawer>.rail,#ds>.shell>.app.drawer>.listcol{transform:none}
  #ds>.shell>.app.drawer:after{content:'';position:absolute;inset:0;background:var(--scrim);z-index:25}
  #ds .topbar{gap:10px;padding:0 10px 0 12px}
  #ds .topbar .hide-sm{display:none}
  #ds .body{--bp:18px}
  .hero-in{padding:28px 22px 0}
  .hero-in>h1{font-size:30px}
  .hero-shot{margin:6px 22px 0;height:260px}
  .hero-stats>div{padding:12px 16px 12px 0;margin-right:16px}
  .dd{grid-template-columns:1fr}
  .tyrow{grid-template-columns:1fr;gap:6px}
  .stagewrap{padding:10px}
  .ramp{grid-template-columns:repeat(3,1fr)}
  .specs,.specs.two{grid-template-columns:1fr}
  .spec-demo{padding:18px;overflow-x:auto}
  .doc .table.card,.doc .card>.table{display:block;overflow-x:auto}
  .pager{grid-template-columns:1fr}
}
@media (max-width:560px){
  /* specimens on a phone follow the same rules a w1 window does */
  .doc .row{flex-wrap:wrap;gap:4px 8px}.doc .row>span:first-child{flex:1 1 100%}.doc .row .acts{display:none}
  .doc .row .rt{text-align:left;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.doc .row .rt .mt{margin:0}
  .doc .task{flex-wrap:wrap}.doc .task .due{margin-left:0;padding-left:29px;flex-basis:100%}
  .doc .statrow{flex-direction:column;gap:20px}.doc .statrow>.stat+.stat{border-left:0;padding-left:0;border-top:1px solid var(--hair);padding-top:20px}
  .doc .setuprow,.doc .srow,.doc .step{flex-wrap:wrap}.doc .srow .a,.doc .step .a,.doc .setuprow .a{margin-left:0;padding-left:0}
  .doc .compare{grid-template-columns:1fr}.doc .compare>div+div{border-left:0;border-top:1px solid var(--line2)}
  .brandmark .wm span{display:none}
  .bigaa{font-size:88px}
}
/* site-only glue */
@keyframes mdin2{from{opacity:0;transform:translateY(2%) scale(.985)}}
.marks{position:absolute;top:0;pointer-events:none}
.stagewrap{position:relative}
.stagewrap>.marks{top:22px;margin-left:22px}
/* Anatomy markers on a layout stage — placed by script from the live elements (see placeMarks) */
.stagewrap>.amarks{position:absolute;inset:0;pointer-events:none;z-index:30}
.anat>div.off{opacity:.45}
.mk{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surf);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--surf),0 6px 16px rgba(0,0,0,.25)}
.hero-shot .stage>.win{box-shadow:0 30px 80px -20px rgba(16,24,40,.35),0 0 0 1px var(--line)}
.ramp>div span{opacity:.85}
.win .tip{display:none}
/* ── v0.9 documentation helpers ── */
.launch{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r3);background:var(--surf);overflow:hidden}
.launch a{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:8px var(--s4);cursor:pointer;color:var(--ink2);transition:background var(--tr)}
.launch a+a{border-top:1px solid var(--hair)}
.launch a:hover{background:var(--sunk)}
.launch a>.ic{color:var(--ter);flex:0 0 auto}
.launch a b{display:block;font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.launch a small{display:block;font-size:12px;color:var(--ter);line-height:1.35}
.launch a .go{margin-left:auto;color:var(--ter);display:flex}
.icbar{display:flex;align-items:center;gap:var(--s3);margin:16px 0 14px;flex-wrap:wrap}
.icbar .srch{flex:1 1 280px;max-width:460px;height:40px;margin:0}
.icbar .srch input{font-size:14px}
.icbar .icclear{display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin-right:-6px;border-radius:var(--r2);color:var(--ter);cursor:pointer;transition:background var(--tr),color var(--tr)}
.icbar .icclear:hover{background:var(--sunk);color:var(--ink)}
.icbar .icclear[hidden]{display:none}
.icbar .ice{font-size:12.5px;color:var(--sec);font-variant-numeric:tabular-nums}
.icgrid>.hid{display:none}
.icempty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:var(--s8) var(--s4);border:1px dashed var(--line2);border-radius:var(--r3);color:var(--sec);font-size:13.5px;text-align:center}
.icempty b{color:var(--ink);font-size:14px;font-weight:600}
.icempty[hidden]{display:none}
.icbar input::-webkit-search-cancel-button,.icbar input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}

/* Optical stroke: an SVG scales its stroke with its viewBox, so a fixed 1.7-unit stroke is a
   hairline at 11px and heavy at 32px. ic() picks the stroke it wants on screen, in px, and
   converts it back to grid units:  px = 1.7 · √(size ÷ 16). The optional third argument is a
   rendered stroke in px, for emphasis (a check in a checkbox, a glyph on a brand fill). */
const strokePx=s=>1.7*Math.sqrt(s/16);
const ic=(n,s=16,px)=>{const w=Math.round((px==null?strokePx(s):px)*16/s*1000)/1000;
  return `<svg class="ic" data-i="${n}" width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`};

const $$=(s,r=document)=>[...r.querySelectorAll(s)];

   :`<div class="ds">${L.s(12,k+'d')}</div>`}

/* ── rows ─────────────────────────────────────────────────────────── */
const FL={crit:{i:'clash',l:'Critical',rel:'contradicts'},warn:{i:'delta',l:'Caution',rel:'does not match'},ask:{i:'help',l:'Question',rel:'open since'}};
K.fdot=(type,n)=>`<span class="fdot f-${type}" title="${n} flagged">${ic('radar',11)}${n}</span>`;

    ${o.live?'':`<span class="acts"><span title="Move">${ic('folder',14)}</span><span title="Share">${ic('share',14)}</span><span class="dg" title="Delete">${ic('trash',14)}</span></span>`}
    <span class="rt">${o.live?`<span class="livechip">${ic('rec',12)}Live</span>`:`<span class="tg c${slot}"><i></i>${L.t(1,k+'g')} / ${L.t(1,k+'h')}</span><span class="mt">${1+hash(k)%11}:${String(hash(k+'m')%6)}${hash(k+'n')%10} ${hash(k)%2?'pm':'am'} · ${hash(k)%4} ipsum</span>`}</span></div>`};
K.task=(k,o={})=>`<div class="task${o.done?' done':''}${o.on?' on':''}" tabindex="0">${K.cbx(o.done)}
  <span style="flex:1;min-width:0"><span class="t">${o.t||L.s(6+hash(k)%4,k).slice(0,-1)}</span>
  <span class="m">${o.compact?`<span class="${o.late?'late':''}">${o.due||'Lorem 14'}</span>`:`${o.hi?'<span class="pri hi">High</span>':''}${ic('users',12)}${L.t(2,k+'src')}`}</span></span>
  ${o.compact?'':`<span class="due${o.late?' dg':''}">${o.done?'Done':o.due||'Fri 14'}</span><span class="kb2" title="Options">${ic('dots',16)}</span>`}</div>`;
K.trow=k=>`<div class="trow"><span style="flex:1;min-width:0"><span class="tx" contenteditable="true">${L.s(9+hash(k)%6,k).slice(0,-1)}</span><span class="tm">${1+hash(k)%11}:${10+hash(k)%49} pm · ${L.w(2,k+'d')}</span></span>
  <span class="acts"><span title="Edit">${ic('edit',14)}</span><span title="Copy">${ic('copy',14)}</span><span title="Play">${ic('play',14)}</span><span class="dg" title="Delete">${ic('trash',14)}</span></span></div>`;
K.flag=(k,type,o={})=>{const f=FL[type],p=person(k);
  return `<div class="flag f-${type}${o.sel?' on':''}${o.done?' done':''}" tabindex="0"><span class="fi">${ic(o.done?'check':f.i,15)}</span>
    <span class="fmain"><span class="ft">${L.t(9,k)}</span><span class="fs"><b>${p.n}</b>, ${10+hash(k)%40}:${String(hash(k+'s')%60).padStart(2,'0')} — “${L.s(11,k+'q').slice(0,-1)}…”</span>
    <span class="fm2"><span>${ic(f.i,12)}${o.lorem?L.w(2,k+'r'):f.rel}</span><span>·</span><span>${ic('history',12)}${L.t(2,k+'o')} · ${1+hash(k)%27} Lorem</span>${o.done?'<span>·</span><span style="font-weight:600">Resolved</span>':''}</span></span>
    <span class="fr">${o.done?`<span class="acts"><span title="Reopen">${ic('undo',14)}</span></span>`:`<span class="age">${2+hash(k)%30} min</span>
      <span class="acts"><span title="Make a task">${ic('list',14)}</span><span class="gd" title="Resolve">${ic('check',14)}</span><span title="Dismiss">${ic('eyeoff',14)}</span></span>`}</span></div>`};
K.sched=(k,n=5)=>{let o='',last='';const days=['Today','Tomorrow','Lorem 14'];
  for(let i=0;i<n;i++){const d=days[Math.min(2,Math.floor(i/2))];if(d!==last){o+=`<div class="schedday">${d}</div>`;last=d}
    const h=9+hash(k+i)%8,slot=1+hash(k+i+'c')%6;
    o+=`<div class="srow2 c${slot}" tabindex="0"><span class="tmc">${h>12?h-12:h}:${hash(k+i)%2?'30':'00'} ${h>=12?'pm':'am'}<span>${[30,45,60][hash(k+i)%3]} min</span></span><span class="rule"></span>
      <span class="bd"><span class="t">${L.t(4,k+i)}</span><span class="s">${L.name(k+i)} · ${L.t(1,k+i+'f')}</span></span><span class="go">${ic('chev',14)}</span></div>`}
  return `<div class="sched">${o}</div>`};
K.records=(k,n,src)=>`<ul class="records">${Array.from({length:n},(_,i)=>`<li><span>${L.s(8+hash(k+i)%8,k+i)}</span>${src?`<span class="from">${L.t(2,k+i+'f')} &rsaquo;</span>`:`<span class="jump">${10+hash(k+i)%40}:${String(hash(k+i+'j')%60).padStart(2,'0')}</span>`}</li>`).join('')}</ul>`;
K.trs=(k,n,live)=>Array.from({length:n},(_,i)=>{const p=person(k+(i%3));const m=Math.floor(i*1.7);
  return `<div class="trs${hash(k+i)%5===0?' hl':''}"><span class="tm">${String(m).padStart(2,'0')}:${String((i*23)%60).padStart(2,'0')}</span><span><span class="spk">${p.n}</span><span class="tx">${L.s(12+hash(k+i)%14,k+'t'+i)}</span>${hash(k+i)%5===0?`<span class="badge">${ic('list',12)}Lorem ipsum 1</span>`:''}</span></div>`}).join('');
K.msg=(r,tx,src,who='L')=>`<div class="msg ${r}"><span class="who">${r==='u'?who:ic('spark',15,2)}</span><span class="tx">${tx}${src?`<br><span class="src">${ic('users',13)}${src}</span>`:''}</span></div>`;
K.stat=(slot,lb,big,dl,icon)=>`<div class="stat c${slot}"><div class="lb">${lb}</div><div class="big">${big}</div><div class="dl">${ic(icon,13)}${dl}</div></div>`;
K.chart=(vals,days,slot,tip)=>{const max=Math.max(...vals)||1,H=120;
  const cols=vals.map((v,i)=>{const h=v?Math.max(3,Math.round(v/max*H)):3;
    return `<span class="col" tabindex="0" aria-label="${days[i]}: ${v}">${`<span class="ttip${tip===i?' pin':''}" style="bottom:${Math.max(8,h-46)}px;left:50%;transform:translateX(-50%)"><b>${v}</b>${days[i]}</span>`}<span class="bar${v?'':' mute'}" style="height:${h}px"></span></span>`}).join('');
  const grid=[.5,1].map(f=>`<span class="gridl" style="bottom:${Math.round(f*H)+9}px"><span>${Math.round(max*f)}</span></span>`).join('');
  return `<div class="chartwrap"><div class="chart c${slot}">${grid}${cols}</div><div class="xax">${days.map(d=>`<span>${d}</span>`).join('')}</div></div>`};
K.hbar=(slot,lb,pct,v)=>`<div class="hbar c${slot}"><span class="lb">${lb}</span><span class="tr"><i style="width:${pct}%"></i></span><span class="vv">${v}&times;</span></div>`;
K.srow=(t,s,a)=>`<div class="srow"><span><span class="t">${t}</span><span class="s">${s}</span></span><span class="a">${a}</span></div>`;
K.sgroup=(t,s,rows)=>`<div class="sgroup"><div class="sghd"><span><b>${t}</b>${s?`<span>${s}</span>`:''}</span></div>${rows}</div>`;

K.notif=(kind,icon,ti,bo,acts)=>`<div class="notif ${kind}"><span class="ai">${ic(icon,17)}</span><span class="bd"><span class="ap">Lorem<span class="w">now</span></span>
  <span class="ti">${ti}</span><span class="bo">${bo}</span>${acts?`<span class="ac">${acts}</span>`:''}</span><span class="x" title="Close">${ic('x',13)}</span></div>`;
K.toast=(kind,icon,b,t)=>`<div class="toast ${kind}">${icon?ic(icon,15):''}<span>${b?`<b>${b}</b> `:''}${t}</span></div>`;
K.lights=()=>`<span class="lights"><i class="r">${ic('x',8,1.5)}</i><i class="y">${ic('minus',8,1.5)}</i><i class="g">${ic('expand',8,1.5)}</i></span>`;
K.compare=k=>`<div class="compare"><div><div class="hd">${ic('mic',12)}Lorem ipsum</div><div class="q">“${L.s(16,k+'a')}”</div><div class="who"><b>${L.name(k+'a')}</b><span>·</span><span>25:30</span></div><div class="lk">${ic('play',12)}Dolor 25:30</div></div>
  <div><div class="hd">${ic('history',12)}Dolor sit amet</div><div class="q">“${L.s(14,k+'b')}”</div><div class="who"><b>${L.name(k+'b')}</b><span>·</span><span>${L.t(2,k+'c')}</span></div><div class="lk">${ic('file',12)}Consectetur ipsum</div></div></div>`;
K.quotebox=k=>`<div class="quotebox"><div class="hd">${ic('speak',14)}Lorem ipsum dolor</div><p>“${L.s(22,k)}”</p><div class="a">${K.btn('Copy lorem','s sm','copy')}${K.btn('Dolor sit','s sm','send')}</div></div>`;

/* ═══════════════════════════ v0.9 kit — overlays, mobile shell, forms ═══════════════════════════
   More string builders in the same style as K above. Everything that opens (a side panel, a sheet,
   a drawer, an action sheet, a full-screen modal) is built here and mounted by OV further down. */
K.n=0;
/* a fixed-size demo window that overlays can live in; width classes follow the measured width */
K.frame=(w,h,inner,o={})=>{const fl=w==='fluid'||o.fluid;return `<div class="win dframe${o.flush?'':' boxed'}${fl?' fluid '+(o.cls||'w3'):' '+wcls(w)}${o.plain?' plain':''}"${fl?'':` data-fw="${w}"`} style="${fl?'width:100%':`width:${w}px;max-width:100%`};height:${h}px;${o.style||''}"${o.attrs||''}>${inner}</div>`};
/* the phone's own chrome — status bar above, home-indicator band below. K.device wraps a screen (a .win) in both. */
K.SYSH=62;
K.sysTop=`<div class="sysbar t" aria-hidden="true"><span>9:41</span><span class="sys"><svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".9"/><rect x="4.7" y="5" width="3" height="6" rx=".9"/><rect x="9.4" y="2.5" width="3" height="8.5" rx=".9"/><rect x="14" y="0" width="3" height="11" rx=".9"/></svg><svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.3 3.6a9.6 9.6 0 0 1 13.4 0"/><path d="M3.7 6.1a6.2 6.2 0 0 1 8.6 0"/><circle cx="8" cy="9.1" r="1.1" fill="currentColor" stroke="none"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="1.9" fill="currentColor"/><path d="M23 4v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".45"/></svg></span></div>`;
K.sysBot=`<div class="sysbar b" aria-hidden="true"><i></i></div>`;
K.device=(screen,w,h,o={})=>`<div class="devfr${o.boxed?' boxed':''}" style="width:${w}px;${o.maxw?'max-width:100%;':''}height:${h}px">${K.sysTop}${screen}${K.sysBot}</div>`;
/* a fluid frame measures itself and wears the width class its own width earns — the same rule as a real window */
K.setW=(el,w)=>{const c=wcls(w).split(' ');['w3','w2','w1','w0'].forEach(x=>el.classList.toggle(x,c.includes(x)))};
K.fro=typeof ResizeObserver!=='undefined'?new ResizeObserver(es=>es.forEach(e=>K.setW(e.target,e.target.offsetWidth))):null;
K.mountFrames=root=>{if(!root||!root.querySelectorAll)return;root.querySelectorAll('.win.fluid').forEach(f=>{if(!f._fm){f._fm=1;K.fro&&K.fro.observe(f)}K.setW(f,f.offsetWidth)})};
K.pgin=(inner,cls='')=>`<div class="pg-in ${cls}">${inner}</div>`;
K.ovg=(inner,o={})=>`<div class="ovg${o.pass?' pass':''}">${o.scrim===false?'':'<div class="scrim" data-ov-close></div>'}${inner}</div>`;
K.x=(label='Close')=>`<span class="tbtn xc" data-ov-close title="${label}" role="button" tabindex="0">${ic('x',17)}</span>`;

/* side panel — header · optional tabs · body · optional footer */
K.sidep=o=>{const id='sp'+(++K.n);
  return `<aside class="sidep ${o.size||''}${o.under?' under':''}${o.cls?' '+o.cls:''}" role="dialog" aria-modal="${o.modal===false?'false':'true'}" aria-labelledby="${id}" tabindex="-1"${o.attrs||''}>
  <div class="sph"><span class="tbtn sbk" data-ov-close title="Back" role="button" tabindex="0">${ic('back',22)}</span>${o.lead||''}<span class="ft"><h2 id="${id}">${o.title}</h2>${o.sub?`<p>${o.sub}</p>`:''}</span><span class="r">${o.tools||''}${K.x('Close panel')}</span></div>
  ${o.tabs||''}<div class="spb">${o.body}</div>${o.foot?`<div class="spf">${o.foot}</div>`:''}</aside>`};
/* bottom sheet */
K.sheet=o=>{const id='sh'+(++K.n);
  return `<section class="sheet${o.tall?' tall':''}${o.cls?' '+o.cls:''}" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1"${o.attrs||''}>
  <div class="shh"><b id="${id}">${o.title}</b><span class="r">${o.tools||`<span class="tbtn" data-ov-close title="Close" role="button" tabindex="0">${ic('x',18)}</span>`}</span></div>
  <div class="shb">${o.body}</div>${o.foot?`<div class="shf">${o.foot}</div>`:''}</section>`};
/* action sheet — a short list of verbs for one object */
K.asheet=o=>`<div class="asheet" role="dialog" aria-modal="true" aria-label="${esc(o.title||'Actions')}" tabindex="-1"><div class="ag">${o.title?`<div class="ah"><b>${o.title}</b>${o.sub?`<span>${o.sub}</span>`:''}</div>`:''}
  ${o.items.map(x=>`<a class="${x.dg?'dg':''}" role="button" tabindex="0" ${x.act?`data-act="${x.act}"`:'data-ov-close'}>${x.i?ic(x.i,18):''}${x.l}</a>`).join('')}</div>
  <div class="ag"><a class="cn" role="button" tabindex="0" data-ov-close>Cancel</a></div></div>`;
/* full-screen modal */
K.fsm=o=>{const id='fs'+(++K.n);
  return `<div class="fsm" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1"><div class="fh"><button class="btn q" data-ov-close>${o.cancel||'Cancel'}</button><b id="${id}">${o.title}</b>${o.action||''}</div><div class="fb">${o.body}</div>${o.foot?`<div class="ff">${o.foot}</div>`:''}</div>`};
/* navigation drawer — the rail as an overlay */
K.ndrawer=(nav,on=0,o={})=>`<aside class="ndrawer" role="dialog" aria-modal="true" aria-label="Navigation" tabindex="-1"><div class="dh"><span class="brandmark"><span class="lg">${ic('layers',16,2)}</span><span class="wm">${o.brand||'Lorem ipsum'}</span></span>${K.x('Close menu')}</div>
  <div class="slab">${o.slab||'Lorem'}</div><div class="nav">${nav.map(([i,l,n],x)=>`<a class="${x===on?'on':''}" role="button" tabindex="0">${ic(i,18)}<span class="lbl">${l}</span>${n!=null?`<span class="n">${n}</span>`:''}</a>`).join('')}</div>
  <div class="spacer"></div><div class="acct c2"><span class="top"><span class="avat">L</span><span class="who"><span class="nm">Lorem Ipsum</span><span class="pl">Dolor plan</span></span></span></div></aside>`;

/* mobile app bar — lead: menu | back | close | none */
K.mbar=o=>{const lead=o.lead==='back'?`<span class="ld${o.leadTxt?' txt':''}" data-mback role="button" tabindex="0" title="Back">${ic('back',22)}${o.leadTxt||''}</span>`
    :o.lead==='close'?`<span class="ld" data-mback role="button" tabindex="0" title="Close">${ic('x',20)}</span>`
    :o.lead==='menu'?`<span class="ld" data-ov="drawer" role="button" tabindex="0" title="Menu">${ic('menu',22)}</span>`:'';
  const acts=(o.actions||[]).map(a=>a.html?a.html:`<span class="tbtn${a.badge?' hasbadge':''}"${a.ov?` data-ov="${a.ov}"`:''}${a.dt?` data-dt-open="${a.dt}" data-dt="${a.id}"`:''} title="${a.t}" role="button" tabindex="0">${ic(a.i,20)}</span>`).join('');
  return `<div class="mbar${o.ctx?' ctx':''}${o.mid?' mid':''}">${lead}<span class="tt"><b>${o.title}</b>${o.sub?`<small>${o.sub}</small>`:''}</span><span class="ac">${acts}</span></div>`};
K.mbarSearch=(ph,v='')=>`<div class="mbar"><span class="ld" data-ov-close role="button" tabindex="0" title="Back">${ic('back',22)}</span><span class="srch">${ic('search',15)}<input placeholder="${ph}" value="${v}" aria-label="${ph}"></span><span class="ac"><span class="tbtn" data-clear title="Clear" role="button" tabindex="0">${ic('x',18)}</span></span></div>`;
/* bottom navigation — 3–5 destinations; a sixth becomes "More" */
K.bnav=(items,on=0)=>`<nav class="bnav" aria-label="Primary">${items.map((x,i)=>`<a class="${i===on?'on':''}" role="button" tabindex="0" ${x.ov?`data-ov="${x.ov}"`:`data-bn="${i}"`}${i===on?' aria-current="page"':''}><span class="pl">${ic(x.i,22)}${x.n?`<span class="npill">${x.n}</span>`:''}${x.dot?'<i class="dotb"></i>':''}</span>${x.l}</a>`).join('')}</nav>`;
const MNAV=nav=>nav.length<=5?nav.map(([i,l,n])=>({i,l:l.length>9?l.split(' ')[0]:l,n:n&&n<100?n:undefined}))
  :nav.slice(0,4).map(([i,l,n])=>({i,l:l.length>9?l.split(' ')[0]:l,n:n&&n<100?n:undefined})).concat([{i:'dots',l:'More',ov:'more'}]);
/* search suggestions for the full-screen mobile search */
K.sgl=(recent,sugg,q='')=>`<div class="sgl"><div class="sgh">Recent<span>Clear</span></div>${recent.map(r=>`<a role="button" tabindex="0">${ic('history',16)}${r}<span class="go">${ic('arrowu',14)}</span></a>`).join('')}
  <div class="sgh">Suggested</div>${sugg.map(r=>`<a role="button" tabindex="0">${ic('search',16)}${r}<span class="go">${ic('chev',14)}</span></a>`).join('')}</div>`;

/* forms */
K.inp=(ph,o={})=>`<span class="inp${o.err?' err':''}${o.cls?' '+o.cls:''}">${o.i?ic(o.i,15):''}<input${o.type?` type="${o.type}"`:''} placeholder="${ph}" value="${o.v||''}" aria-label="${esc(o.label||ph)}"${o.name?` name="${o.name}"`:''}${o.req?' aria-required="true"':''}${o.err?' aria-invalid="true"':''}>${o.suf||''}</span>`;
K.ta=(ph,o={})=>`<span class="inp area"><textarea placeholder="${ph}" aria-label="${esc(o.label||ph)}"${o.name?` name="${o.name}"`:''}>${o.v||''}</textarea></span>`;
K.fsel=(value,o={})=>`<span class="sel full${o.err?' err':''}" role="button" tabindex="0" aria-haspopup="listbox" data-opts="${esc(o.opts||value)}"${o.ph?' data-ph="1"':''}${o.name?` data-name="${o.name}"`:''}><span>${o.i?ic(o.i,14):''}<b style="font-weight:${o.ph?400:500};color:${o.ph?'var(--ter)':'inherit'}">${value}</b></span>${ic('chevd',12)}</span>`;
K.fld=(label,control,o={})=>`<div class="fld${o.cls?' '+o.cls:''}"><span class="fl">${label}${o.req?'<span class="rq" title="Required">*</span>':''}${o.n?`<span class="n">${o.n}</span>`:''}</span>${control}${o.err?`<span class="fmsg" role="alert">${ic('alertc',13)}${o.err}</span>`:o.hint?`<span class="hint">${o.hint}</span>`:''}</div>`;
K.fsub=(title,sub,inner)=>`<div class="fsub"><div class="fh"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div>${inner}</div>`;
K.fchk=(ctl,label,sub)=>`<label class="fchk">${ctl}<span>${label}${sub?`<small>${sub}</small>`:''}</span></label>`;
K.kvl=(rows,cls='')=>`<div class="kvl ${cls}">${rows.map(([k,v])=>`<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>`;
K.skel=(w='60%',h=10,cls='')=>`<span class="skel ${cls}" style="width:${w};height:${typeof h==='number'?h+'px':h}"></span>`;

/* small data graphics — stats stay unboxed, so their trend is a hairline, not a chart */
K.spark=(vals,slot=1,w=96,h=28)=>{const mx=Math.max(...vals),mn=Math.min(...vals),sp=(mx-mn)||1,n=vals.length;
  const pts=vals.map((v,i)=>[+(i/(n-1)*(w-4)+2).toFixed(1),+(h-3-((v-mn)/sp)*(h-8)).toFixed(1)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join('');
  return `<svg class="spk c${slot}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true"><path d="${d}L${w-2} ${h}L2 ${h}z" fill="var(--cT)" opacity=".7"/><path d="${d}" stroke="var(--cI)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[n-1][0]}" cy="${pts[n-1][1]}" r="2.2" fill="var(--cI)"/></svg>`};
K.line=(series,labels,o={})=>{const H=o.h||150,W=600,pad=6;const all=series.flatMap(s=>s.v),mx=Math.max(...all)*1.08,mn=0;
  const X=(i,n)=>pad+i/(n-1)*(W-pad*2),Y=v=>H-pad-((v-mn)/((mx-mn)||1))*(H-pad*2);
  const paths=series.map((s,si)=>{const d=s.v.map((v,i)=>(i?'L':'M')+X(i,s.v.length).toFixed(1)+' '+Y(v).toFixed(1)).join('');
    return `<g class="c${s.slot||1}">${si===0?`<path d="${d}L${W-pad} ${H}L${pad} ${H}z" fill="var(--cT)" opacity=".55"/>`:''}<path d="${d}" fill="none" stroke="var(--cI)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"${s.dash?' stroke-dasharray="5 4"':''}/></g>`}).join('');
  const grid=[.5,1].map(f=>`<span class="gridl" style="bottom:${Math.round(f*(H-pad*2))+pad}px"><span>${Math.round(mx/1.08*f)}</span></span>`).join('');
  return `<div class="chartwrap"><div class="lchart" style="height:${H}px">${grid}<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" width="100%" height="${H}" aria-hidden="true">${paths}</svg></div><div class="xax">${labels.map(d=>`<span>${d}</span>`).join('')}</div></div>`};

/* ═══════════════════════════ data table engine ═══════════════════════════
   The .table foundation grown into a family. One engine, many configurations: it holds the rows, the
   filters, the sort, the column order, the selection and the page for every table instance, and renders
   the toolbar, the applied-filters bar, the table, the mobile card list and the footer from that state.
   State is per instance id, so a table in a layout and the same table in a spec stay independent. */
const DT={cfg:{},st:{}};
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
DT.STAT={'Active':{c:'ok',i:'checkc'},'Pending':{c:'info',i:'clock'},'On hold':{c:'warn',i:'pause'},'Overdue':{c:'dg',i:'alertc'},'Archived':{c:'mute',i:'archive'},
  'Approved':{c:'ok',i:'checkc'},'Rejected':{c:'dg',i:'x'},'In review':{c:'info',i:'eye'},'Draft':{c:'mute',i:'edit'},
  'Paid':{c:'ok',i:'checkc'},'Packed':{c:'info',i:'box'},'Shipped':{c:'info',i:'truck'},'Delivered':{c:'ok',i:'check'},'Refunded':{c:'warn',i:'undo'},'Failed':{c:'dg',i:'alertc'},
  'Invited':{c:'info',i:'mail'},'Suspended':{c:'warn',i:'lock'},'Unfulfilled':{c:'warn',i:'box'},'Open':{c:'info',i:'inbox'},'Resolved':{c:'ok',i:'checkc'}};
DT.STAGES=['Discovery','Proposal','Review','Delivery'];DT.REG=['North','South','East','West'];
DT._own=null;DT.own=()=>DT._own||(DT._own=people('own',5));
DT.dlabel=d=>{if(d===0)return 'Today';if(d===1)return 'Yesterday';const t=new Date(2026,9,9-d);return t.getDate()+' '+MONS[t.getMonth()]};
DT.money=v=>'$'+Number(v).toLocaleString('en-US');
DT.records=(n,seed='r')=>Array.from({length:n},(_,i)=>{const k=seed+i,h=hash(k);
  const stt=['Active','Active','Pending','Active','On hold','Overdue','Pending','Archived'][h%8];const o=DT.own()[hash(k+'o')%5];
  return {id:seed+i,name:L.t(2,k),sub:'REC-'+(1040+i*7+h%5),slot:1+h%6,g:IDGLY[h%IDGLY.length],status:stt,owner:o.n,oc:o.c,oi:o.i,stage:DT.STAGES[hash(k+'s')%4],
    value:(1+hash(k+'v')%96)*1000+(hash(k+'w')%10)*100,progress:stt==='Archived'?100:stt==='Pending'?hash(k+'p')%30:10+hash(k+'p')%88,region:DT.REG[hash(k+'g')%4],days:hash(k+'d')%90}});
DT.RC=[
 {k:'name',l:'Name',t:'name',p:1,sort:1,filter:'text',w:208},
 {k:'status',l:'Status',t:'status',p:1,sort:1,filter:'enum',w:128},
 {k:'owner',l:'Owner',t:'person',p:2,sort:1,filter:'enum',w:136},
 {k:'stage',l:'Stage',t:'tag',p:3,sort:1,filter:'enum'},
 {k:'value',l:'Value',t:'money',p:2,sort:1,filter:'range',num:1},
 {k:'progress',l:'Progress',t:'progress',p:3,sort:1},
 {k:'region',l:'Region',t:'text',p:3,sort:1,filter:'enum'},
 {k:'updated',l:'Updated',t:'date',p:3,sort:1,filter:'date',get:r=>20000-r.days}];
DT.DATES=[['','Any time'],['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days']];

/* register an instance. Anything omitted falls back to the generic "records" table. */
DT.reg=(id,o={})=>{const cols=o.cols||DT.RC,cfg=Object.assign({id,title:'Records',noun:'records',one:'record',tb:'standard',sel:false,exp:false,dense:false,pin:false,act:true,acts:['view','edit','more'],
    colui:'icons',fpanel:true,colset:true,mobile:'prio',pp:8,pager:true,rowOpen:'detail',add:true,applied:true},o,{cols,rows:o.rows||DT.records(o.n||36,id)});
  cfg.col={};cols.forEach(c=>cfg.col[c.k]=c);DT.cfg[id]=cfg;
  DT.st[id]={q:'',sort:cfg.sort||null,filters:cfg.filters?JSON.parse(JSON.stringify(cfg.filters)):{},order:cols.map(c=>c.k),hide:new Set(cfg.hide||[]),sel:new Set(cfg.selected||[]),exp:new Set(cfg.expanded||[]),
    page:1,pp:cfg.pp,dense:!!cfg.dense,mode:cfg.mode||null,view:cfg.views?cfg.views[0].id:null,cur:cfg.cur||null,draft:null};
  return id};
DT.rst=id=>{const c=DT.cfg[id];if(c)DT.reg(id,c._o||c)};
DT.val=(c,r)=>c.get?c.get(r):r[c.k];
DT.txt=(c,r)=>{if(c.txt)return c.txt(r);const v=DT.val(c,r);return c.t==='money'?DT.money(v):c.t==='date'?DT.dlabel(r.days):String(v)};
/* ── the pipeline: view → search → filters → sort ── */
DT.match=(c,r,f)=>{const v=DT.val(c,r);
  if(c.filter==='enum')return !f||!f.length||f.includes(v);
  if(c.filter==='text')return !f||String(v).toLowerCase().includes(String(f).toLowerCase());
  if(c.filter==='range'){const mn=f&&f.min!==''&&f.min!=null?+f.min:null,mx=f&&f.max!==''&&f.max!=null?+f.max:null;return (mn==null||v>=mn)&&(mx==null||v<=mx)}
  if(c.filter==='date')return !f||r.days<=+f;return true};
DT.active=(c,f)=>{if(f==null)return false;if(c.filter==='enum')return f.length>0;if(c.filter==='range')return (f.min!==''&&f.min!=null)||(f.max!==''&&f.max!=null);if(c.filter==='date')return !!f;if(c.filter==='text')return !!String(f).trim();return false};
DT.rowsWith=(id,filters,o={})=>{const cfg=DT.cfg[id],st=DT.st[id];let r=cfg.rows.slice();
  if(cfg.views&&st.view&&!o.noview){const v=cfg.views.find(x=>x.id===st.view);if(v&&v.fn)r=r.filter(v.fn)}
  if(st.q){const q=st.q.toLowerCase();r=r.filter(x=>cfg.cols.some(c=>['name','text','person','tag','status'].includes(c.t)&&String(DT.val(c,x)).toLowerCase().includes(q)))}
  for(const k in filters){const c=cfg.col[k];if(c&&DT.active(c,filters[k]))r=r.filter(x=>DT.match(c,x,filters[k]))}
  return r};
DT.rows=id=>{const cfg=DT.cfg[id],st=DT.st[id];let r=DT.rowsWith(id,st.filters);
  if(st.sort){const c=cfg.col[st.sort.k];if(c){const d=st.sort.dir==='desc'?-1:1;r.sort((a,b)=>{const x=DT.val(c,a),y=DT.val(c,b);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y)))*d})}}
  return r};
DT.nf=id=>{const cfg=DT.cfg[id],st=DT.st[id];return Object.keys(st.filters).filter(k=>cfg.col[k]&&DT.active(cfg.col[k],st.filters[k])).length};
DT.vcols=id=>{const cfg=DT.cfg[id],st=DT.st[id];return st.order.map(k=>cfg.col[k]).filter(c=>c&&!st.hide.has(c.k))};
DT.sortLabels=c=>c.t==='date'?['Oldest first','Newest first']:(c.num||c.t==='money'||c.t==='progress')?['Low to high','High to low']:['A to Z','Z to A'];
DT.chipText=(c,f)=>{if(c.filter==='enum')return f.length>2?`${f[0]}, ${f[1]} +${f.length-2}`:f.join(', ');
  if(c.filter==='range'){const a=f.min!==''&&f.min!=null,b=f.max!==''&&f.max!=null;const m=c.t==='money'?DT.money:x=>x;return a&&b?`${m(+f.min)} – ${m(+f.max)}`:a?`≥ ${m(+f.min)}`:`≤ ${m(+f.max)}`}
  if(c.filter==='date')return DT.DATES.find(x=>x[0]===f)[1];return `“${f}”`};

/* ── cells ── */
DT.cell=(c,r)=>{if(c.fn&&c.t!=='html')return c.fn(r,c);switch(c.t){
  case 'name':return `<span class="cp">${K.well(r.slot,32,r.g)}<span><span class="nm">${r.name}</span><span class="em">${r.sub}</span></span></span>`;
  case 'status':{const m=DT.STAT[r.status]||{c:'mute',i:'info'};return `<span class="cst ${m.c}">${ic(m.i,14)}${r.status}</span>`}
  case 'person':return `<span class="cp" style="gap:8px"><span class="avat" style="width:24px;height:24px;font-size:10.5px;background:${r.oc};color:#fff">${r.oi}</span><span style="font-size:13px;color:var(--ink2)">${r.owner}</span></span>`;
  case 'money':return DT.money(r.value);
  case 'progress':return `<span class="cprog${r.progress>=100?' hi':''}"><i><b style="width:${r.progress}%"></b></i>${r.progress}%</span>`;
  case 'date':return `<span class="dtd">${DT.dlabel(r.days)}</span>`;
  case 'tag':return `<span class="tag box">${DT.val(c,r)}</span>`;
  case 'html':return c.fn(r);
  default:return esc(DT.val(c,r))}};

/* ── toolbar ── */
DT.bar=(id,total)=>{const cfg=DT.cfg[id],st=DT.st[id],nf=DT.nf(id);
  if(st.sel.size)return DT.bulk(id,total);
  const t=cfg.tb;if(t==='none')return '';
  const title=`<span class="tt"><b>${cfg.title}</b><span class="n">${total}</span></span>`;
  const srch=`<span class="srch">${ic('search',15)}<input data-dt-q data-fk="q" placeholder="Search ${cfg.noun}" value="${esc(st.q)}" aria-label="Search ${cfg.noun}"></span>`;
  const ico=t==='compact';
  const btn=(kind,icon,txt,on,n,cls='')=>`<button class="btn s sm ${ico?'ico ':''}${cls}${on?' on':''}" data-dt-open="${kind}" data-fk="tb-${kind}"${ico?` title="${txt}"`:''}>${ic(icon,14)}${ico?'':`<span class="tx">${txt}</span>`}${n?`<span class="nb">${n}</span>`:''}</button>`;
  const bF=cfg.fpanel?btn('filter','filter','Filter',nf>0,nf||'','filter'):'';
  const bS=cfg.fpanel?btn('sort','sort','Sort',!!st.sort,'','sort'):'';
  const bC=cfg.colset?btn('cols','columns','Columns',false,'','hm'):'';
  const bX=ico?'':`<button class="btn q sm hm" data-dt-act="export">${ic('down',14)}<span class="tx hid">Export</span></button>`;
  const bO=`<button class="btn q sm ico ov" data-dt-open="overflow" data-fk="tb-ov" title="More">${ic('dots',16)}</button>`;
  const bA=cfg.add?`<button class="btn p sm add${ico?' ico':''}" data-dt-open="add" data-fk="tb-add"${ico?` title="Add ${cfg.one}"`:''}>${ic('plus',14)}${ico?'':`<span class="tx">Add ${cfg.one}</span>`}</button>`:'';
  const brk='<span class="brk"></span>';
  if(t==='minimal')return `<div class="dtbar">${title}<span class="fill"></span>${bX}${bO.replace('ov"','ov" ')}${bA}</div>`;
  if(t==='search')return `<div class="dtbar">${srch.replace('class="srch"','class="srch" style="flex:1 1 280px;width:auto;max-width:420px;height:36px"')}${bF}${bS}<span class="fill"></span>${bC}${bO}${bA}</div>`;
  if(ico)return `<div class="dtbar">${srch}${bF}${bS}${bC}<span class="fill"></span>${bO}${bA}</div>`;
  return `<div class="dtbar">${title}${brk}${srch}${bF}${bS}${bC}<span class="fill"></span>${bX}${bO}${bA}</div>`};
DT.bulk=(id,total)=>{const cfg=DT.cfg[id],st=DT.st[id],n=st.sel.size;
  return `<div class="dtbar bulk" role="toolbar" aria-label="Bulk actions"><span class="tt"><span class="tbtn" data-dt-act="clearsel" data-fk="b-x" title="Clear selection" role="button" tabindex="0">${ic('x',16)}</span><b>${n} selected</b></span>
  <button class="btn s sm" data-dt-act="assign" title="Assign" aria-label="Assign">${ic('userplus',14)}<span class="tx">Assign</span></button><button class="btn s sm" data-dt-act="export" title="Export" aria-label="Export">${ic('down',14)}<span class="tx">Export</span></button><button class="btn s sm" data-dt-act="archive" title="Archive" aria-label="Archive">${ic('archive',14)}<span class="tx">Archive</span></button><button class="btn d q sm" data-dt-act="bulkdel" title="Delete" aria-label="Delete">${ic('trash',14)}<span class="tx">Delete</span></button>
  <span class="fill"></span>${n<total?`<span class="link" data-dt-act="selall" role="button" tabindex="0" aria-label="Select all ${total}"><span class="lw">Select all ${total}</span><span class="ln">All ${total}</span></span>`:''}</div>`};
DT.views=id=>{const cfg=DT.cfg[id],st=DT.st[id];
  return `<div class="tabs" role="tablist">${cfg.views.map(v=>{const n=v.fn?cfg.rows.filter(v.fn).length:cfg.rows.length;return `<a class="${v.id===st.view?'on':''}" role="tab" tabindex="0" aria-selected="${v.id===st.view}" data-dt-view="${v.id}" data-fk="v-${v.id}">${v.l}<span class="cnt${v.hot&&n?' hot':''}">${n}</span></a>`}).join('')}</div>`};
DT.applied=(id,total)=>{const cfg=DT.cfg[id],st=DT.st[id];if(cfg.applied===false)return '';
  const keys=Object.keys(st.filters).filter(k=>cfg.col[k]&&DT.active(cfg.col[k],st.filters[k]));if(!keys.length&&!st.sort)return '';
  const chip=(k,c,txt)=>`<span class="achip"><span class="k">${c.l}:</span><b>${txt}</b><span class="x" data-dt-rm="${k}" role="button" tabindex="0" title="Remove ${c.l} filter" aria-label="Remove ${c.l} filter">${ic('x',11)}</span></span>`;
  const sc=st.sort&&cfg.col[st.sort.k];
  return `<div class="dtapplied" role="group" aria-label="Applied filters"><span class="lb">${keys.length?'Filtered':'Sorted'}</span>${keys.map(k=>chip(k,cfg.col[k],DT.chipText(cfg.col[k],st.filters[k]))).join('')}
   ${sc?`<span class="achip"><span class="k">Sort:</span><b>${sc.l} ${st.sort.dir==='desc'?'↓':'↑'}</b><span class="x" data-dt-rm="__sort" role="button" tabindex="0" title="Remove sort" aria-label="Remove sort">${ic('x',11)}</span></span>`:''}
   <span class="link" data-dt-clearall role="button" tabindex="0">Clear all</span><span class="rs"><b>${total}</b> of ${cfg.rows.length}</span></div>`};

/* ── table ── */
DT.th=(id,c)=>{const cfg=DT.cfg[id],st=DT.st[id];const srt=st.sort&&st.sort.k===c.k?st.sort.dir:null;const fa=c.filter&&DT.active(c,st.filters[c.k]);
  const s=cfg.colui==='icons'&&c.sort;const fb=cfg.colui==='icons'&&c.filter,menu=cfg.colui==='menu'&&(c.sort||c.filter);
  const pin=cfg.pin&&c.k===cfg.cols[0].k;
  return `<th class="${c.num||c.t==='money'?'num ':''}${s?'s ':''}${pin?'pl last':''}" data-k="${c.k}" data-p="${c.p||1}"${pin?` style="left:${(cfg.exp?34:0)+(cfg.sel?44:0)}px;min-width:${c.w||200}px"`:c.w?` style="min-width:${c.w}px"`:''}${srt?` aria-sort="${srt==='asc'?'ascending':'descending'}"`:''}${s?` tabindex="0" data-fk="th-${c.k}"`:''}>
   <span class="hl">${c.l}${s?`<span class="si">${ic(srt==='asc'?'arrowu':srt==='desc'?'arrowd':'sort',12)}</span>`:''}</span>${fb?`<span class="hb${fa?' on':''}" data-dt-open="colfilter" data-k="${c.k}" data-fk="hb-${c.k}" role="button" tabindex="0" title="Filter ${c.l}" aria-label="Filter ${c.l}">${ic('filter',12)}</span>`:''}${menu?`<span class="hb${fa||srt?' on':''}" data-dt-open="colmenu" data-k="${c.k}" data-fk="hb-${c.k}" role="button" tabindex="0" title="${c.l} options" aria-label="${c.l} options" aria-haspopup="dialog">${ic('chevd',12)}</span>`:''}</th>`};
DT.table=(id,rows)=>{const cfg=DT.cfg[id],st=DT.st[id],cols=DT.vcols(id);const nc=cols.length+(cfg.sel?1:0)+(cfg.exp?1:0)+(cfg.act?1:0);
  const all=rows.length&&rows.every(r=>st.sel.has(r.id)),some=rows.some(r=>st.sel.has(r.id));
  const off=cfg.exp?34:0;

  const body=rows.map(r=>{const on=st.sel.has(r.id),cur=st.cur===r.id,ex=st.exp.has(r.id);

    return `<tr class="${on||cur?'on ':''}${cfg.rowOpen?'row-link':''}" data-r="${r.id}"${cfg.rowOpen?' tabindex="0"':''}>${cfg.exp?`<td class="xp${cfg.pin?' pl':''}" style="${cfg.pin?'left:0':''}"><span class="tw${ex?' o':''}" data-dt-tw="${r.id}" data-fk="tw-${r.id}" role="button" tabindex="0" aria-expanded="${ex}" aria-label="${ex?'Collapse':'Expand'} ${r.name}">${ic('chev',13,1.75)}</span></td>`:''}${cfg.sel?`<td class="sc${cfg.pin?' pl':''}"${cfg.pin?` style="left:${off}px"`:''}><span class="cbx${on?' on':''}" data-dt-sel="${r.id}" data-fk="sel-${r.id}" role="checkbox" aria-checked="${on}" tabindex="0" aria-label="Select ${r.name}">${ic('check',12,2)}</span></td>`:''}${tds}${acts}</tr>`
     +(ex?`<tr class="xr"><td colspan="${nc}"><div class="xin"><span><span class="k">Description</span><span class="v">${L.s(9,r.id+'x')}</span></span><span><span class="k">Created</span><span class="v">${DT.dlabel(r.days+12)} · ${r.owner}</span></span><span><span class="k">Last activity</span><span class="v">${L.t(3,r.id+'a')}</span></span><span class="xa">${K.btn('Open','s sm','external',` data-dt-open="detail" data-r="${r.id}"`)}${K.btn('Edit','q sm','edit',` data-dt-open="edit" data-r="${r.id}"`)}</span></div></td></tr>`:'')}).join('');
  return `<table class="table${st.dense?' dense':''}${cfg.sel?' has-sel':''}"><caption class="sr-only">${cfg.title}</caption>${head}<tbody>${body}</tbody></table>`};
DT.skel=id=>{const cfg=DT.cfg[id],cols=DT.vcols(id);

DT.cards=(id,rows)=>{const cfg=DT.cfg[id],st=DT.st[id];const cols=DT.vcols(id).filter(c=>c.t!=='name'&&c.t!=='status'&&!c.key).sort((a,b)=>(a.p||1)-(b.p||1)).slice(0,4);
  const stc=DT.vcols(id).find(c=>c.t==='status');
  return `<div class="rcards">${rows.map(r=>{const on=st.sel.has(r.id);const m=stc&&DT.STAT[r.status];
   return `<div class="rcard${on?' on':''}" data-r="${r.id}" ${cfg.rowOpen?'tabindex="0"':''}>${cfg.sel?`<span class="cbx${on?' on':''}" data-dt-sel="${r.id}" data-fk="csel-${r.id}" role="checkbox" aria-checked="${on}" tabindex="0" aria-label="Select ${r.name}">${ic('check',12,2)}</span>`:''}
     <span class="bd"><span class="hd"><span class="nm">${r.name}</span>${m?`<span class="cst ${m.c}" style="font-size:12px">${ic(m.i,13)}${r.status}</span>`:''}</span><span class="sb">${r.sub}${r.owner?' · '+r.owner:''}</span>
     <span class="kv2">${cols.map(c=>`<span><span>${c.l}</span><b>${c.t==='progress'?r.progress+'%':DT.txt(c,r)}</b></span>`).join('')}</span></span>
     ${cfg.act?`<span class="kb2" data-dt-open="more" data-r="${r.id}" role="button" tabindex="0" title="More actions" aria-label="More actions for ${r.name}">${ic('dotsv',17)}</span>`:`<span style="align-self:center">${ic('chev',14)}</span>`}</div>`}).join('')}</div>`};
DT.stateBox=(id,kind)=>{const cfg=DT.cfg[id];
  const m={empty:['inbox',`No ${cfg.noun} yet`,`${cap(cfg.noun)} you add will appear here. Start with one, or bring in what you already have.`,`<button class="btn p sm" data-dt-open="add">${ic('plus',14)}Add ${cfg.one}</button><button class="btn s sm" data-dt-act="import">${ic('upload',14)}Import</button>`,''],
    error:['alertc',`Couldn't load ${cfg.noun}`,'The request timed out. Nothing was lost — your filters and selection are still here.',`<button class="btn s sm" data-dt-act="retry">${ic('refresh',14)}Try again</button>`,' dg'],
    none:['search',`No ${cfg.noun} match`,'Nothing fits every filter at once. Remove one, or clear them all to see everything again.',`<button class="btn s sm" data-dt-clearall>Clear all filters</button>`,'']}[kind];
  return `<div class="dtstate${m[4]}" role="${kind==='error'?'alert':'status'}"><span class="ico">${ic(m[0],20)}</span><b>${m[1]}</b><p>${m[2]}</p><div class="a">${m[3]}</div></div>`};
DT.foot=(id,total)=>{const cfg=DT.cfg[id],st=DT.st[id];if(!cfg.pager||total===0)return '';

  const pages=Math.max(1,Math.ceil(total/st.pp)),p=Math.min(st.page,pages),a=(p-1)*st.pp+1,b=Math.min(total,p*st.pp);
  const nums=[];for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-p)<=1)nums.push(i);else if(nums[nums.length-1]!=='…')nums.push('…')}
  return `<div class="dtfoot"><span class="rs">Showing <b>${a}–${b}</b> of <b>${total}</b></span><span class="pp">Rows per page <span class="sel" data-dt-open="pp" data-fk="pp" role="button" tabindex="0" aria-haspopup="menu">${st.pp}${ic('chevd',12)}</span></span>
   <span class="pg" role="navigation" aria-label="Pagination"><span class="pgn pn prv${p===1?' dis':''}" data-dt-pg="${p-1}" data-fk="pg-prev" role="button" tabindex="${p===1?-1:0}" aria-label="Previous page" aria-disabled="${p===1}">${ic('chevl',14)}</span>${nums.map(n=>n==='…'?'<span class="gap">…</span>':`<span class="pgn${n===p?' on':''}" data-dt-pg="${n}" data-fk="pg-${n}" role="button" tabindex="0"${n===p?' aria-current="page"':''}>${n}</span>`).join('')}<span class="pgn pn nxt${p===pages?' dis':''}" data-dt-pg="${p+1}" data-fk="pg-next" role="button" tabindex="${p===pages?-1:0}" aria-label="Next page" aria-disabled="${p===pages}">${ic('chev',14)}</span></span></div>`};
DT.html=id=>{const cfg=DT.cfg[id],st=DT.st[id];const all=DT.rows(id),total=all.length;
  let mode=st.mode;if(!mode&&cfg.rows.length===0)mode='empty';if(!mode&&total===0)mode='none';

DT.make=(id,o)=>{DT.reg(id,Object.assign({},o,{_o:o}));return DT.html(id)};

/* ── edge shadows: the sticky Action column and pinned column only cast a shadow while content is under them ── */
DT.edge=w=>{const sl=w.scrollLeft>1,sr=w.scrollLeft+w.clientWidth<w.scrollWidth-1,stp=w.scrollTop>1;
  sl?w.setAttribute('data-sl',''):w.removeAttribute('data-sl');sr?w.setAttribute('data-sr',''):w.removeAttribute('data-sr');stp?w.setAttribute('data-st',''):w.removeAttribute('data-st')};

DT.mountAll=root=>{if(!root||!root.querySelectorAll)return;K.mountFrames(root);const ws=[...root.querySelectorAll('.dtwrap')];if(root.matches&&root.matches('.dtwrap'))ws.push(root);
  ws.forEach(w=>{if(!w._dtm){w._dtm=1;DT.ro&&DT.ro.observe(w)}w.style.setProperty('--dtw',w.clientWidth+'px');DT.edge(w)})};
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('dtwrap'))DT.edge(t)},true);

DT.refresh=id=>{$$(`.dt[data-dt="${id}"]`).forEach(old=>{
  const wrap=old.querySelector('.dtwrap'),sl=wrap?wrap.scrollLeft:0,stp=wrap?wrap.scrollTop:0;
  const ae=document.activeElement,fk=ae&&old.contains(ae)?ae.getAttribute('data-fk'):null,caret=ae&&ae.selectionStart;
  const tmp=document.createElement('div');tmp.innerHTML=DT.html(id);const nu=tmp.firstElementChild;old.replaceWith(nu);
  const w2=nu.querySelector('.dtwrap');if(w2){w2.scrollLeft=sl;w2.scrollTop=stp}
  tips(nu);if(fk){const f=nu.querySelector(`[data-fk="${fk}"]`);if(f){f.focus({preventScroll:true});if(caret!=null&&f.setSelectionRange)try{f.setSelectionRange(caret,caret)}catch(e){}}}})};

/* ── filter controls — shared by the table-level panel and the per-column popover ── */
DT.opts=(id,k)=>{const cfg=DT.cfg[id],c=cfg.col[k],m={};cfg.rows.forEach(r=>{const v=DT.val(c,r);m[v]=(m[v]||0)+1});

  return `<span class="inp">${ic('search',14)}<input data-dt-ftx="${k}" data-fk="ftx-${k}" placeholder="Contains…" value="${esc(f||'')}" aria-label="${c.l} contains"></span>`};

/* ── keyboard: grips, menus, trap, escape ── */

      else{T.setAttribute('aria-grabbed','false');row.classList.remove('dragging');KB=null;OV.say(`${name} dropped at position ${items().indexOf(row)+1} of ${items().length}.`)}return}
    if(grabbed&&(key==='ArrowUp'||key==='ArrowDown')){H(e);const it=items(),i=it.indexOf(row),j=i+(key==='ArrowUp'?-1:1);if(j<0||j>=it.length)return;

    if(!grabbed&&(key==='ArrowUp'||key==='ArrowDown')){const it=items().filter(x=>!x.classList.contains('off')),i=it.indexOf(row),n=it[i+(key==='ArrowUp'?-1:1)];if(n){H(e);n.querySelector('[data-dt-grip]').focus()}return}}

/* ── pointer reorder for the column list ── */
let DRAG=null;
document.addEventListener('pointerdown',e=>{const grip=e.target.closest&&e.target.closest('[data-dt-grip]');if(!grip||e.button>0)return;const row=grip.closest('.cs');if(!row||row.classList.contains('off'))return;
  e.preventDefault();try{grip.setPointerCapture(e.pointerId)}catch(_){}row.classList.add('dragging');grip.setAttribute('aria-grabbed','true');
  DRAG={row,grip,list:row.parentElement,y0:e.clientY,id:dtid(row),pid:e.pointerId,k:OV.k(OV.host(row))}});
document.addEventListener('pointermove',e=>{const D=DRAG;if(!D||e.pointerId!==D.pid)return;const put=()=>D.row.style.transform=`translateY(${(e.clientY-D.y0)/D.k}px)`;put();
  const step=()=>{const r=D.row.getBoundingClientRect(),c=r.top+r.height/2,pv=D.row.previousElementSibling,nx=D.row.nextElementSibling;
    if(pv&&pv.matches('.cs[data-ck]')){const pr=pv.getBoundingClientRect();if(c<pr.top+pr.height/2){D.list.insertBefore(D.row,pv);D.y0-=pr.height;put();return true}}
    if(nx&&nx.matches('.cs[data-ck]')){const nr=nx.getBoundingClientRect();if(c>nr.top+nr.height/2){D.list.insertBefore(nx,D.row);D.y0+=nr.height;put();return true}}return false};
  let n=0;while(step()&&n++<4);});
const endDrag=cancel=>{const D=DRAG;if(!D)return;DRAG=null;D.row.classList.remove('dragging');D.row.style.transform='';D.grip.setAttribute('aria-grabbed','false');
  const st=DT.st[D.id],order=[...D.list.querySelectorAll('.cs[data-ck]')].map(x=>x.dataset.ck);
  if(cancel){OV.panelRefresh(D.list.closest('.sidep'));return}
  if(order.join()!==st.order.join()){st.order=order;DT.refresh(D.id);OV.say(`${DT.cfg[D.id].col[D.row.dataset.ck].l} moved to position ${order.indexOf(D.row.dataset.ck)+1} of ${order.length}.`)}};
document.addEventListener('pointerup',e=>{if(DRAG&&e.pointerId===DRAG.pid)endDrag(false)});
document.addEventListener('pointercancel',e=>{if(DRAG&&e.pointerId===DRAG.pid)endDrag(true)});

/* ═══════════════════════════ shells ═══════════════════════════
   One screen, three window classes. A layout hands its content to a shell and the shell decides what

const spec=(title,meta,demo,o={})=>`<div class="spec${o.cls?' '+o.cls:''}"${o.style?` style="${o.style}"`:''}><div class="spec-hd"><span class="t">${title}</span>${meta?`<span class="m">${meta}</span>`:''}

  <div class="spec-demo ${o.demo||''}">${demo}</div>${o.notes?`<div class="spec-notes">${o.notes}</div>`:''}${o.nocode?'':'<div class="spec-code"><pre></pre></div>'}</div>`;

  <div class="dont"><div class="h">Don't</div><div class="ex">${dontEx}</div><div class="why">${dontWhy}</div></div></div>`;

const P_color=()=>`
${sec('Brand ramp','Nine steps along one hue. The system needs the brand at six weights — a fill, a hover, an ink that passes on white, two tints and a ring — so the ramp is interpolated rather than invented per use. <b>Fill</b> sits around o500–o600, <b>ink</b> around o700. Switch mode in the top bar and every value below updates.',
 `<div class="ramp">${['o50','o100','o200','o300','o400','o500','o600','o700','o800'].map(s=>`<div data-copy="var(--${s})" data-fgbox="--${s}" style="background:var(--${s})" title="Copy var(--${s})"><b>${s}</b><span data-var="--${s}"></span></div>`).join('')}</div>`)}
${sec('Brand roles','Components never reach for a ramp step directly — they use a role. The role decides which step, per mode, so a component written once is right in light and dark.',
 `<div class="swgrid">${sw('--brandFill','brandFill','Primary buttons, the send well, the floating core')}${sw('--brandFillHov','brandFillHov','Hover on a brand fill')}${sw('--brandOn','brandOn','Text and icons on a brand fill')}
 ${sw('--brandInk','brandInk','Brand as text: active nav, links, selected chips')}${sw('--brand','brand','Marks: focus ring, toggle on, tab underline, checkbox')}${sw('--tint','tint','Selected row, active nav, user bubble')}
 ${sw('--tint2','tint2','Selected-and-quiet: sub-nav, hover on brand text')}${sw('--ring','ring','3px focus halo around a focused field')}${sw('--onChip','onChip','A chip sitting on top of a brand fill')}</div>`)}
${sec('Surfaces & lines','Most surfaces sit flat on the page and are separated by a hairline. Depth comes from a step in surface, not a shadow.',
 `<div class="swgrid">${sw('--backdrop','backdrop','Behind the app window')}${sw('--rail','rail','Sidebars, modal navigation, capture card')}${sw('--surf','surf','The content surface — lightest in light mode')}
 ${sw('--sunk','sunk','Inset wells: search, add-row, hover, player')}${sw('--line','line','Borders of cards, panels, inputs at rest')}${sw('--hair','hair','Dividers between rows of the same list')}
 ${sw('--line2','line2','Stronger borders: secondary buttons, fields')}${sw('--meterOff','meterOff','Inactive meter and chart bars')}${sw('--scrim','scrim','Behind a modal')}</div>`)}
${sec('Ink','Four steps of text. <b>ink</b> and <b>ink2</b> carry content, <b>sec</b> is anything read as a sentence, <b>ter</b> is for labels, counts and icons — it still holds 4.5 : 1 so nothing drops below AA.',
 `<div class="swgrid">${sw('--ink','ink','Titles, values, primary text')}${sw('--ink2','ink2','Body text, controls')}${sw('--sec','sec','Descriptions, sub-lines, meta')}${sw('--ter','ter','Micro-labels, counts, icons, placeholders')}</div>`)}
${sec('Status families','Danger, warning, success and info are shared by both modes so a red always reads as a red. Each is a family, because one hex cannot do every job: the <b>mark</b> is the dot or fill, <b>Ink</b> is the same hue darkened until text passes 4.5 : 1, and <b>Tint</b> / <b>Line</b> are the surface it sits on.',
 `<div class="statusgrid">${[['danger','Danger','alertc'],['warn','Warning','alert'],['ok','Success','check'],['info','Info','info']].map(([k,l,i])=>`<div class="stc"><div class="hd" style="color:var(--${k}Ink)">${ic(i,16)}${l}</div>
  <div class="rows"><div style="background:var(--${k});color:#fff">mark</div><div style="background:var(--${k}Ink);color:var(--surf)">Ink</div><div style="background:var(--${k}Tint);color:var(--${k}Ink)">Tint</div><div style="background:var(--${k}Line);color:var(--${k}Ink)">Line</div></div>

 ${ticks(['The container — <code>.dtwrap</code> — is the only element that scrolls horizontally. The page and the window never do.','The Action column carries <b>at most four icon actions</b>; anything beyond that goes behind the overflow menu.','A pinned <b>first column</b> is optional and uses the same technique on the left, with its own shadow, for tables where the row key must stay visible.','Each column keeps a <code>min-width</code> so a narrow container scrolls instead of squashing text into columns of one word.'])}`)}

/* ── icon library search: live filter over the name and a keyword list ── */
const icFilter=q=>{const g=$('#icgrid');if(!g)return;const terms=q.toLowerCase().split(/\s+/).filter(Boolean),tot=+g.dataset.total;let n=0;
  $$('[data-copyicon]',g).forEach(c=>{const w=c.dataset.k.toLowerCase().split(/\s+/);const ok=terms.every(t=>w.some(x=>x.startsWith(t)));c.classList.toggle('hid',!ok);if(ok)n++});
  $('#icn').textContent=terms.length?`${n} of ${tot} icons`:`${tot} icons`;
  const em=$('#icempty');em.hidden=n>0;if(!n)em.innerHTML=`<b>No icons match “${esc(q.trim())}”</b><span>Try a broader word — “arrow”, “user”, “file” — or clear the search.</span>`;
  $('#icclr').hidden=!q};
document.addEventListener('input',e=>{if(e.target&&e.target.id==='icq')icFilter(e.target.value)});
document.addEventListener('keydown',e=>{const T=e.target;if(T&&T.id==='icq'&&e.key==='Escape'&&T.value){e.preventDefault();e.stopPropagation();T.value='';icFilter('')}});
document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('#icclr');if(c){const i=$('#icq');i.value='';icFilter('');i.focus()}});
document.addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('#icclr');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click()}});

function parseColor(s){s=(s||'').trim();if(s.startsWith('#')){let h=s.slice(1);if(h.length===3)h=h.split('').map(c=>c+c).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),1]}
  const m=s.match(/rgba?\(([^)]+)\)/);if(m){const p=m[1].split(/[ ,/]+/).filter(Boolean).map(Number);return [p[0],p[1],p[2],p[3]??1]}return null}

const cv=(el,v)=>getComputedStyle(el).getPropertyValue(v).trim();

  $$('[data-fgbox]').forEach(el=>{const c=parseColor(cv(el,el.dataset.fgbox));if(c)el.style.color=lum(c)>.4?'rgba(0,0,0,.7)':'rgba(255,255,255,.9)'});

const VOID=new Set(['input','br','hr','img','meta']);
function fmtNode(n,d){const pad='  '.repeat(d);
  if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ').trim();return t?pad+esc(t)+'\n':''}
  if(n.nodeType!==1)return '';const tag=n.tagName.toLowerCase();
  const attrs=[...n.attributes].filter(a=>!['tabindex','aria-label','aria-hidden','role','aria-checked','aria-current','aria-selected'].includes(a.name)||(a.name==='role'&&!['button','link'].includes(a.value))).map(a=>{const nm=a.name==='data-tt'?'title':a.name;return ` <span class="at">${nm}</span>=<span class="av">"${esc(a.value)}"</span>`}).join('');
  if(tag==='svg'){const nm=n.dataset.i||'';return `${pad}<span class="tg">&lt;svg</span> <span class="at">class</span>=<span class="av">"ic"</span> <span class="cm">${nm?'/* '+nm+' · '+(n.getAttribute('width')||16)+'px */':''}</span><span class="tg">/&gt;</span>\n`}
  const open=`<span class="tg">&lt;${tag}</span>${attrs}<span class="tg">&gt;</span>`;
  if(VOID.has(tag))return pad+open+'\n';
  const kids=[...n.childNodes].filter(c=>!(c.nodeType===3&&!c.textContent.trim()));
  if(!kids.length)return `${pad}${open}<span class="tg">&lt;/${tag}&gt;</span>\n`;
  if(kids.length===1&&kids[0].nodeType===3&&kids[0].textContent.length<70)return `${pad}${open}${esc(kids[0].textContent.trim())}<span class="tg">&lt;/${tag}&gt;</span>\n`;
  return `${pad}${open}\n${kids.map(c=>fmtNode(c,d+1)).join('')}${pad}<span class="tg">&lt;/${tag}&gt;</span>\n`;
}

  if((el=T.closest('.copybtn'))){copy(plain(codeFor(el.closest('.spec'))),'Markup for this specimen.');return}
  if((el=T.closest('[data-copyfrom]'))){copy($(el.dataset.copyfrom).textContent);return}
  if((el=T.closest('[data-download]'))){const k=el.dataset.download;const txt=$(k==='tokens'?'#ds-tokens':'#ds-components').textContent.trim();const b=new Blob([txt],{type:'text/css'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=k+'.css';document.body.appendChild(a);a.click();a.remove();return}
  if((el=T.closest('[data-copyicon]'))){copy(ic(el.dataset.copyicon).replace(/ data-i="[^"]*"/,''),`The ${el.dataset.copyicon} icon.`);return}
  if((el=T.closest('[data-copy]'))){copy(el.dataset.copy,el.dataset.copy);return}
  if((el=T.closest('[data-expand]'))){expand(el.dataset.expand);return}
  if((el=T.closest('.replay'))){const box=el.closest('.card').querySelector('.stagebox');box.innerHTML=motionDemo(box.dataset.demo);return}
  if((el=T.closest('[data-stagew] span[data-w]'))){const seg=el.parentElement;$$('span',seg).forEach(s=>s.classList.toggle('on',s===el));const st=$('#st-'+seg.dataset.stagew);st.dataset.h=+el.dataset.w<840?1100:900;buildStage(st,+el.dataset.w);return}
  if((el=T.closest('.colbtn[data-col]'))){const app=el.closest('.app'),bar=el.closest('.rail,.listcol');
    if(bar&&bar.dataset.peek){delete bar.dataset.peek;app.classList.remove('pkrail','pklist');el.classList.remove('pin');if(app.id==='dsapp'){S.railmin=false;store.set('ds-rail','0')}return}
    const k=el.dataset.col==='rail'?'railmin':'listmin';app.classList.toggle(k);if(app.id==='dsapp'){S.railmin=app.classList.contains('railmin');S.userRail=S.railmin;store.set('ds-rail',S.railmin?'1':'0')}
    const on=app.classList.contains(k);el.innerHTML=ic(on?'panelR':'panelL',17);el.dataset.tt=on?'Expand':'Collapse';tipHide();return}
  if((el=T.closest('.tw[data-tree]'))){e.stopPropagation();el.classList.toggle('o');const open=el.classList.contains('o');$$(`[data-of="${el.dataset.tree}"]`,el.closest('.views')).forEach(s=>s.classList.toggle('hidden',!open));return}
  if((el=T.closest('.tabs a[data-t]'))&&!el.classList.contains('off')){const tabs=el.parentElement;$$('a',tabs).forEach(a=>a.classList.toggle('on',a===el));if(tabs.dataset.tabs)switchPanes(el,tabs.dataset.tabs,el.dataset.t);return}
  if((el=T.closest('.mnav[data-tabs] a[data-t]'))){const nav=el.parentElement;$$('a',nav).forEach(a=>a.classList.toggle('on',a===el));switchPanes(el,nav.dataset.tabs,el.dataset.t);return}
  if((el=T.closest('.seg span'))&&!el.closest('.modeseg,[data-stagew]')){const seg=el.parentElement;$$('span',seg).forEach(s=>s.classList.toggle('on',s===el));if(seg.dataset.seg)switchPanes(el,seg.dataset.seg,el.dataset.t);return}
  if((el=T.closest('.tog'))&&!el.classList.contains('dis')){el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));return}
  if((el=T.closest('.cbx'))){el.classList.toggle('on');el.setAttribute('aria-checked',el.classList.contains('on'));const t=el.closest('.task');if(t)t.classList.toggle('done',el.classList.contains('on'));return}
  if((el=T.closest('.opt'))){const g=el.parentElement;$$(':scope>.opt',g).forEach(o=>{o.classList.toggle('on',o===el);const r=$('.rdo',o);if(r)r.classList.toggle('on',o===el)});return}
  if((el=T.closest('.fchip'))&&!el.closest(".tmx-c")){const sib=[...el.parentElement.children].filter(x=>x.classList.contains('fchip'));if(sib.length>1)sib.forEach(s=>s.classList.toggle('on',s===el));return}
  if((el=T.closest('.convrow'))){$$('.convrow',el.parentElement).forEach(c=>c.classList.toggle('on',c===el));return}
  if((el=T.closest('.secmore'))){el.classList.toggle('open');el.firstElementChild.textContent=el.classList.contains('open')?'Show less':'View all 7';return}
  if((el=T.closest('.task,.flag'))&&el.closest('.win,.spec')&&!T.closest('.acts,.kb2')){$$(el.classList.contains('task')?'.task':'.flag',el.closest('.list,.band')||el.parentElement).forEach(x=>x.classList.toggle('on',x===el));return}
});
document.addEventListener('input',e=>{if(e.target.id==='dsq'){S.q=e.target.value;renderList()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const v=$('.viewer');if(v)v.remove();$('#dsapp')&&$('#dsapp').classList.remove('drawer')}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&!e.target.isContentEditable){e.preventDefault();e.target.click()}
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){const q=$('#dsq');if(q){e.preventDefault();q.focus()}}
});
function autoRail(){const app=$('#dsapp');if(!app)return;if(innerWidth<=900){app.classList.remove('railmin');return}const want=innerWidth<1240;
  if(S.userRail===null){app.classList.toggle('railmin',want);S.railmin=want}}
addEventListener('resize',()=>{autoRail();$$('.stage').forEach(fitStage)});

/* ═══════════════════════════ boot ═══════════════════════════ */
(function boot(){
  const mode=store.get('ds-mode');const r=document.documentElement;
  r.dataset.theme=mode||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const ur=store.get('ds-rail');if(ur!==null){S.userRail=ur==='1';S.railmin=S.userRail}
  const [gid,pid]=location.hash.replace(/^#\/?/,'').split('/');const g=GROUPS.find(x=>x.id===gid);
  if(g){S.g=g.id;S.p=(g.pages.find(x=>x.id===pid)||g.pages[0]).id}
  renderShell();autoRail();renderPage();tips($('#ds'));
})();
</script>
