/* ═══════════════════════════ floating control ═══════════════════════════
   One object, three shapes: an idle 60px core with a hover tray, a short
   capsule while capturing, a pill while live. Dark in both modes. */
.fab{position:absolute;z-index:18;width:max-content;user-select:none}
.fab.static{position:relative}
.fab.idle{width:60px;height:60px}
.fab-home{position:absolute;bottom:0;right:0;display:flex;align-items:center;border-radius:var(--rF);background:transparent;
  transition:background .2s,box-shadow .2s,padding .22s var(--pop)}
.fab.idle:hover .fab-home,.fab.idle.open .fab-home{background:var(--pill);box-shadow:var(--pillShadow);padding-left:15px}
.fab-opts{display:flex;align-items:center;gap:9px;width:0;opacity:0;pointer-events:none;overflow:visible;transition:width .24s var(--pop),margin .24s var(--pop),opacity .16s}
.fab.idle:hover .fab-opts,.fab.idle.open .fab-opts{width:132px;margin-right:9px;opacity:1;pointer-events:auto}
.hopt{width:38px;height:38px;border-radius:50%;background:var(--pillWell);color:var(--pillInk);display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;transition:background .13s,transform .11s}
.hopt:hover{background:rgba(255,255,255,.20);transform:translateY(-1px)}
.fab-core{width:60px;height:60px;border-radius:50%;background:var(--brandFill);color:var(--brandOn);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  box-shadow:0 10px 26px rgba(0,0,0,.26),0 0 0 1px rgba(0,0,0,.06);cursor:grab;transition:background .16s,box-shadow .2s}
.fab-core:hover{background:var(--brandFillHov)}
.fab.idle:hover .fab-core,.fab.idle.open .fab-core{box-shadow:0 0 0 1px rgba(0,0,0,.10)}
.pill{display:flex;align-items:center;gap:9px;height:52px;padding:0 9px 0 8px;border-radius:var(--rF);background:var(--pill);color:var(--pillInk);box-shadow:var(--pillShadow);cursor:grab;position:relative;
  animation:pgrow .22s var(--pop)}
@keyframes pgrow{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.pill .pmark{width:36px;height:36px;border-radius:50%;background:var(--pillWell);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pill .pdiv{width:1px;height:22px;background:var(--pillLine);flex:0 0 auto}
.pill .pstat{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding-left:1px}
.pill .rdot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:0 0 auto;animation:pdot 1.7s ease-in-out infinite}
@keyframes pdot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(217,45,32,.55)}55%{opacity:.55;box-shadow:0 0 0 5px rgba(217,45,32,0)}}
.pill .pstat b{font-size:15px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.pill .plabel{font-size:13px;font-weight:600;white-space:nowrap}
.pill .psub{font-size:12px;color:var(--pillSec);white-space:nowrap}
.fab.paused .pill .rdot{background:var(--warn);animation:none}
.fab.paused .pill .pstat b{color:var(--pillSec)}
.pmeter{display:flex;align-items:center;gap:2.5px;height:20px;flex:0 0 auto}
.pmeter i{width:2.5px;border-radius:2px;background:var(--pillInk);opacity:.5;transition:height .14s linear}
.pmeter.live i{background:#4ADE80;opacity:.95}
.pbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--pillInk);background:var(--pillWell);flex:0 0 auto;cursor:pointer;position:relative;transition:background .13s,transform .11s}
.pbtn:hover{background:rgba(255,255,255,.19);transform:translateY(-1px)}
.pbtn.stop{background:var(--danger);color:#fff}
.pbtn.stop:hover{filter:brightness(1.1)}
.pbtn.on{background:var(--pillInk);color:var(--pill)}
.pbtn .b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:var(--rF);padding:0 5px;font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  background:var(--warn);color:#241500;border:2px solid var(--pill)}
.pbtn .b.hot{background:var(--danger);color:#fff}
.fab.alert .pill{box-shadow:var(--pillShadow),0 0 0 1.5px var(--danger),0 0 0 7px var(--dangerTint);animation:phalo 2.4s ease-in-out infinite}
@keyframes phalo{0%,100%{box-shadow:var(--pillShadow),0 0 0 1.5px var(--danger),0 0 0 5px var(--dangerTint)}50%{box-shadow:var(--pillShadow),0 0 0 1.5px var(--danger),0 0 0 10px var(--dangerTint)}}
.pill .pbar{width:104px;height:4px;border-radius:2px;background:var(--pillWell);overflow:hidden;flex:0 0 auto}
.pill .pbar i{display:block;height:100%;border-radius:2px;background:#4ADE80;animation:pfill 3.1s linear infinite}
@keyframes pfill{from{width:6%}to{width:100%}}
.pop{width:326px}
.pop .pcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r4);box-shadow:var(--shadow);overflow:hidden}
.pop .ph2{display:flex;align-items:center;gap:9px;padding:12px 14px 0}
.pop .ph2 .age{margin-left:auto;font-size:11.5px;color:var(--ter);white-space:nowrap}
.pop .ptx{padding:10px 15px 0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.pop .psy{padding:9px 15px 0;font-size:12.5px;line-height:1.55;color:var(--sec)}
.pop .psy b{color:var(--ink2);font-weight:600}
.pop .pfoot{display:flex;gap:7px;padding:13px 14px 14px;flex-wrap:wrap}
.pop .pfoot .btn{flex:1 1 auto;justify-content:center}
.pop .more{border-top:1px solid var(--line);padding:10px 15px;font-size:12.5px;font-weight:600;color:var(--brandInk);cursor:pointer;display:flex;align-items:center;gap:7px}
.pop .more:hover{background:var(--sunk)}
.pop .more .n{margin-left:auto;color:var(--ter);font-weight:500}
.plist .pl{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;cursor:pointer;border-left:3px solid var(--fc);background:var(--fcT)}
.plist .pl+.pl{border-top:1px solid var(--surf)}
.plist .pl .fi{width:22px;height:22px;border-radius:var(--r1);background:var(--surf);color:var(--fcI);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.plist .pl .l1{font-size:12.5px;font-weight:600;color:var(--fcI);display:block}
.plist .pl .l2{font-size:12px;color:var(--ink2);display:block;margin-top:3px;line-height:1.45}
.plist .pl .age{font-size:11px;color:var(--sec);white-space:nowrap;flex:0 0 auto;margin-top:2px}
.hidden{display:none!important}
/* ═══════════════════════════ responsive — window width classes ═══════════════════════════
   Widths are measured on the WINDOW, not the viewport: w3 < 1320 · w2 < 1080 · w1 < 840.
   The list column auto-collapses under 1180 and the rail under 960. */
.win.w3 .body{--bp:22px}
.win.w3 .aside{width:340px;flex-basis:340px}
.win.w3 .tabs{gap:var(--s5)}
.win.w3 .aside.wide{position:absolute;right:0;top:0;bottom:0;width:min(430px,86%);flex-basis:auto;z-index:15;box-shadow:var(--shadow)}
.win.w2 .body{--bp:18px}
.win.w2 .g2,.win.w2 .dcols,.win.w2 .homegrid{grid-template-columns:minmax(0,1fr);gap:var(--s6)}
.win.w2 .topbar{gap:10px;padding:0 12px 0 16px}
.win.w2 .topbar .state{display:none}
.win.w2 .mnav{width:60px;padding:14px 8px;align-items:center}
.win.w2 .mnav h3,.win.w2 .mnav .gl,.win.w2 .mnav .lbl{display:none}
.win.w2 .mnav a{justify-content:center;width:40px;height:40px;padding:0}
.win.w2 .chart{height:112px}
.win.w2 .stat .big{font-size:23px}
.win.w2 .metrics{gap:var(--s4)}
.win.w2 .statrow{gap:var(--s5)}
.win.w2 .statrow>.stat+.stat{padding-left:var(--s5)}
.win.w2 .aside,.win.w2 .aside.wide{position:absolute;right:0;top:0;bottom:0;width:min(370px,90%);flex-basis:auto;z-index:15;box-shadow:var(--shadow2)}
.win.w2 .compare{grid-template-columns:1fr}
.win.w2 .compare>div+div{border-left:0;border-top:1px solid var(--line2)}
.win.w2 .tiles{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.win.w2 .actbar .r{margin-left:0}
.win.w1 .mnav{display:none}
.win.w1 .body{--bp:14px}
.win.w1 .topbar h1{font-size:17px}
.win.w1 .tabs{gap:var(--s4)}
.win.w1 .tabs a{font-size:13px}
.win.w1 .titlehd h1{font-size:21px}
.win.w1 .pagehd h1{font-size:20px}
.win.w1 .stat .big{font-size:22px}
.win.w1 .statrow{flex-direction:column;gap:var(--s5)}
.win.w1 .statrow>.stat+.stat{border-left:0;padding-left:0;border-top:1px solid var(--hair);padding-top:var(--s5)}
.win.w1 .toolrow .r{margin-left:0}
.win.w1 .setuprow,.win.w1 .step,.win.w1 .srow{flex-wrap:wrap}
.win.w1 .setuprow .a,.win.w1 .step .a,.win.w1 .srow .a{margin-left:0;padding-left:47px}
.win.w1 .row{flex-wrap:wrap;gap:var(--s1) var(--s2);padding:12px 10px}
.win.w1 .row>span:first-child{flex:1 1 100%}
.win.w1 .row .acts{display:none}
.win.w1 .row .rt{text-align:left;min-width:0;display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.win.w1 .row .rt .mt{margin:0}
.win.w1 .player{gap:var(--s2);padding:8px 10px}
.win.w1 .meter{display:none}
.win.w1 .task{flex-wrap:wrap}
.win.w1 .task .due{margin-left:0;padding-left:29px;flex-basis:100%}
.win.w1 .livebar{flex-wrap:wrap}
.win.w1 .livebar .a{margin-left:0;width:100%}
.win.w1 .modal{border-radius:var(--r4)}
.win.w1 .tiles{grid-template-columns:1fr}
.win.w1 .tile{min-height:0}
.win.w1 .trw .mt{display:none}
.win.w1 .tiles-sm{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.win.w1 .pill{height:46px;gap:7px}
.win.w1 .pill .pmark{display:none}
.win.w1 .pill .pbtn{width:32px;height:32px}
.win.w1 .aside,.win.w1 .aside.wide{width:92%}

/* ═══════════════════════════ glue ═══════════════════════════ */
.pkgap{display:none}
.app.pkrail>.pkgap.pr{display:block;flex:0 0 72px}
.app.pklist>.pkgap.pl{display:block;flex:0 0 56px}
/* the app window: .win on the root element, plus .w3/.w2/.w1 by measured width */
.win{position:relative;overflow:hidden;background:var(--surf)}
.win>.shell{height:100%}
.list>*,.scrollcol>*,.pane>*,.sched>*,.tlist>*,.records>*{flex:0 0 auto}
.pane>.scrollcol,.pane>.notebox{flex:1 1 auto;min-height:0}
.fab .pop{position:absolute;right:0;bottom:100%;padding-bottom:14px;transform-origin:88% 100%;animation:wpin .17s var(--pop)}
.fab .pop:after,.pop.tail:after{content:'';position:absolute;right:25px;bottom:9px;width:12px;height:12px;background:var(--surf);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg);border-bottom-right-radius:3px}
@keyframes wpin{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:none}}
.menu a .k .ic{color:var(--brandInk)}
.aside .ph .fi2{width:26px;height:26px;border-radius:var(--r1);background:var(--fcT);color:var(--fcI);display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* ═══════════════════════════ v0.9 · the platform layer ═══════════════════════════
   Everything from here down extends the system from one desktop window to
   desktop, tablet and phone: overlays that change shape (side panel → sheet),
   the mobile shell, forms, and the data-table family. It uses only the tokens
   above and the same width classes — a fourth step is added, .w0 < 600 (phone).
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── overlay group: a scrim and the surface it holds, as one thing that opens and closes ── */
.ovg{position:absolute;inset:0;z-index:20;pointer-events:none}
.ovg>*{pointer-events:auto}
.ovg.pass{pointer-events:none}
.ovg.pass>*{pointer-events:auto}
.ovg>.scrim{animation:scrimIn .2s ease both}
.ovg.out>.scrim{animation:scrimOut .17s ease both}
@keyframes scrimIn{from{opacity:0}}
@keyframes scrimOut{to{opacity:0}}

/* ── side panel ───────────────────────────────────────────────────────────────────────
   A transient surface that slides in from the right and sits above the page. Four
   widths; the panel never exceeds the window. Modal panels carry a scrim; a
   non-modal preview does not, and leaves the page behind it alive. */
.sidep{--spw:440px;position:absolute;top:0;right:0;bottom:0;z-index:21;width:min(var(--spw),100%);display:flex;flex-direction:column;
  background:var(--surf);border-left:1px solid var(--line);box-shadow:var(--panelShadow);outline:0;animation:spIn .26s var(--sbT) both}
.sidep.sm{--spw:360px}.sidep.lg{--spw:560px}.sidep.xl{--spw:720px}
.sidep.under{top:56px}
@keyframes spIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;transform:translateX(24px)}}
.ovg.out>.sidep{animation:spOut .17s ease both}
.sph{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:10px var(--s3) 10px var(--s5);border-bottom:1px solid var(--line);flex:0 0 auto}
.sph>.well,.sph>.avat{flex:0 0 auto}
.sph .ft{min-width:0;flex:1}
.sph h2{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sph p{font-size:12.5px;color:var(--sec);line-height:1.45;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sph .r{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.sidep>.tabs{padding:0 var(--s5);margin:0;flex:0 0 auto;gap:var(--s5)}
.spb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:var(--s5);display:flex;flex-direction:column;gap:var(--s6)}
.spb>*{flex:0 0 auto}
.spb .ghd{margin-bottom:var(--s2)}
.spf{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s5);border-top:1px solid var(--line);flex:0 0 auto;background:var(--surf)}
.spf .sp-l{margin-right:auto;font-size:12.5px;color:var(--sec);font-variant-numeric:tabular-nums}
.spf .sp-l b{color:var(--ink2);font-weight:600}

/* ── sheets: bottom-anchored surfaces for the phone ──────────────────────────────────── */
.sheet,.win.w0 .sidep{position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;max-height:88%;z-index:21;display:flex;flex-direction:column;
  background:var(--surf);border:0;border-top:1px solid var(--line);border-radius:var(--r5) var(--r5) 0 0;box-shadow:var(--sheetShadow);outline:0;animation:shIn .28s var(--sbT) both}
@keyframes shIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes shOut{to{transform:translateY(100%)}}
.ovg.out>.sheet,.win.w0 .ovg.out>.sidep{animation:shOut .18s ease both}
.sheet:before,.win.w0 .sidep:not(.m-full):before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:0 0 auto}
.sheet.tall,.win.w0 .sidep.m-tall{height:88%}
.win.w0 .sidep.m-full{top:0;max-height:none;height:auto;border:0;border-radius:0;animation:fsmIn .28s var(--sbT) both}
.win.w0 .ovg.out>.sidep.m-full{animation:fsmOut .18s ease both}
@keyframes fsmIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fsmOut{to{opacity:0;transform:translateY(28px)}}
.sheet .sph,.win.w0 .sidep .sph{min-height:52px;padding-left:var(--s4)}
.sheet .shh{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s4) 10px;border-bottom:1px solid var(--hair);flex:0 0 auto}
.sheet .shh b{font-family:var(--f-head);font-size:15px;font-weight:600;letter-spacing:-.01em}
.sheet .shh .r{margin-left:auto;display:flex;align-items:center;gap:var(--s1)}
.sheet .shb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:var(--s2) var(--s4) var(--s4)}
.sheet .shf,.win.w0 .spf{display:flex;gap:var(--s2);padding:10px var(--s4) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:0 0 auto;background:var(--surf)}
.sheet .shf .btn,.win.w0 .spf .btn{flex:1;height:44px}
.win.w0 .spf .sp-l{display:none}
.win.w0 .spb{padding:var(--s4);gap:var(--s5)}
.win.w0 .sidep>.tabs{padding:0 var(--s4);margin:0}
.sbk{display:none}
.win.w0 .sidep.m-full .sbk{display:flex;width:44px;height:44px;margin-right:-6px}
.win.w0 .sidep.m-full .sph{padding-left:var(--s2)}
.win.w0 .sidep.m-full .sph>.well,.win.w0 .sidep.m-full .sph>.avat{display:none}
.win.w0 .sidep.m-full .xc{display:none}
/* a row of destinations inside a sheet — the overflow menu of the bottom bar */
.sheet .navlist{display:flex;flex-direction:column}
.sheet .navlist a{display:flex;align-items:center;gap:var(--s3);height:48px;padding:0 var(--s2);border-radius:var(--r2);font-size:14.5px;color:var(--ink2);cursor:pointer;transition:background var(--tr)}
.sheet .navlist a:hover{background:var(--sunk)}
.sheet .navlist a .ic{color:var(--ter)}
.sheet .navlist a .n{margin-left:auto;font-size:12px;color:var(--ter);font-variant-numeric:tabular-nums}
.sheet .navlist a.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.sheet .navlist a.on .ic{color:var(--brandInk)}

/* action sheet — a short list of verbs for one object */
.asheet{position:absolute;left:var(--s2);right:var(--s2);bottom:var(--s2);z-index:21;display:flex;flex-direction:column;gap:var(--s2);animation:shIn .28s var(--sbT) both;outline:0}
.ovg.out>.asheet{animation:shOut .18s ease both}
.asheet .ag{background:var(--surf);border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;box-shadow:var(--e3)}
.asheet .ah{padding:12px var(--s4) 10px;text-align:center;border-bottom:1px solid var(--hair)}
.asheet .ah b{display:block;font-family:var(--f-head);font-size:13.5px;font-weight:600;color:var(--ink)}
.asheet .ah span{display:block;font-size:12px;color:var(--ter);margin-top:1px}
.asheet a{display:flex;align-items:center;gap:var(--s3);height:50px;padding:0 var(--s4);font-size:15px;color:var(--ink2);cursor:pointer;transition:background var(--tr)}
.asheet a+a{border-top:1px solid var(--hair)}
.asheet a:hover{background:var(--sunk)}
.asheet a .ic{color:var(--ter)}
.asheet a.dg,.asheet a.dg .ic{color:var(--dangerInk)}
.asheet a.cn{justify-content:center;font-weight:600;color:var(--ink)}

/* navigation drawer — the rail, as an overlay */
.ndrawer{position:absolute;top:0;bottom:0;left:0;z-index:21;width:min(300px,86%);background:var(--rail);border-right:1px solid var(--line);box-shadow:var(--peekShadow);
  display:flex;flex-direction:column;padding:var(--s3);animation:drIn .26s var(--sbT) both;outline:0;overflow-y:auto}
.ovg.out>.ndrawer{animation:drOut .18s ease both}
@keyframes drIn{from{transform:translateX(-100%)}to{transform:none}}
@keyframes drOut{to{transform:translateX(-100%)}}
.ndrawer .dh{display:flex;align-items:center;gap:var(--s2);padding:2px 2px 14px}
.ndrawer .dh .brandmark{flex:1}
.ndrawer .nav a{height:44px}
.ndrawer .acct{margin-top:auto}

/* full-screen modal — a task that deserves the whole phone */
.fsm{position:absolute;inset:0;z-index:21;display:flex;flex-direction:column;background:var(--surf);animation:fsmIn .28s var(--sbT) both;outline:0}
.ovg.out>.fsm{animation:fsmOut .18s ease both}
.fsm>.fh{display:flex;align-items:center;gap:var(--s1);height:52px;padding:0 var(--s2);border-bottom:1px solid var(--line);flex:0 0 auto}
.fsm>.fh b{flex:1;min-width:0;text-align:center;font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsm>.fh .btn{flex:0 0 auto}
.fsm .fb{flex:1;min-height:0;overflow-y:auto;padding:var(--s4);display:flex;flex-direction:column;gap:var(--s5)}
.fsm .ff{display:flex;gap:var(--s2);padding:10px var(--s4) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:0 0 auto}
.fsm .ff .btn{flex:1;height:44px}

/* compact dialog — what a confirm becomes on a phone */
.win.w0 .modal{border-radius:var(--r5)}
.win.w0 .modal .mfoot{flex-direction:column-reverse}
.win.w0 .modal .mfoot .btn{height:44px;flex:0 0 auto}
.win.w0 .modal.fs{left:0;top:0;transform:none;width:100%!important;height:100%;max-width:none;max-height:none;border-radius:0;animation:fsmIn .28s var(--sbT) both}
.win.w0 .modal.fs .mnav{display:none}
.win.w0 .modal.fs .mtop{padding:var(--s4)}
.win.w0 .modal.fs .mcont{padding:var(--s4)}

/* the demo window used by component specimens — a positioned box overlays can live in */
.win.dframe{min-width:0;display:flex;flex-direction:column}
/* a demo window that fills a spec card has no edge of its own — the card's border is its edge.
   One that stands on the page or on a sunk well (phone, tablet, a centred table) is .boxed. */
.win.dframe.boxed{border:1px solid var(--line);border-radius:var(--r4)}
.dframe>.pg-in{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;padding:var(--s4);gap:var(--s3);background:var(--sunk);overflow:hidden}
.dframe.plain>.pg-in{background:var(--surf)}

/* ── the phone shell: app bar, bottom bar ───────────────────────────────────────────── */
.shell.m{background:var(--surf)}
.shell.m>.app>.main{min-width:0}
.mbar{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:var(--s1);padding:0 var(--s2);background:var(--surf);border-bottom:1px solid var(--line);z-index:6;min-width:0}
.mbar .ld{width:44px;height:44px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:0 0 auto;cursor:pointer;transition:background var(--tr),color var(--tr)}
.mbar .ld:hover{background:var(--sunk)}
.mbar .ld.txt{width:auto;padding:0 10px 0 6px;gap:2px;font-size:14px;font-weight:500;color:var(--brandInk)}
.mbar .tt{flex:1;min-width:0;padding:0 var(--s1)}
.mbar .tt b{display:block;font-family:var(--f-head);font-size:17px;font-weight:600;letter-spacing:-.012em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbar .tt small{display:block;font-size:11.5px;color:var(--ter);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.mbar.mid .tt{text-align:center}
.mbar .ac{display:flex;align-items:center;flex:0 0 auto}
.mbar .ac .tbtn,.mbar .ac .btn{flex:0 0 auto}
.mbar .ac .tbtn{width:44px;height:44px}
.mbar .ac .btn.t{padding:0 12px;height:40px;font-size:14px}
.mbar.ctx{background:var(--tint);border-bottom-color:transparent}
.mbar.ctx .tt b,.mbar.ctx .ld,.mbar.ctx .tbtn{color:var(--brandInk)}
.mbar .srch{flex:1;margin:0 var(--s1);height:40px}
.mbar .srch input{font-size:16px}
.bnav{display:flex;flex:0 0 auto;height:62px;padding:0 var(--s1) env(safe-area-inset-bottom,0px);background:var(--surf);border-top:1px solid var(--line);z-index:6}
.bnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--ter);cursor:pointer;position:relative;transition:color var(--tr)}
.bnav a .pl{width:52px;height:28px;border-radius:var(--rF);display:flex;align-items:center;justify-content:center;transition:background var(--tr);position:relative}
.bnav a:hover .pl{background:var(--sunk)}
.bnav a.on{color:var(--brandInk);font-weight:600}
.bnav a.on .pl{background:var(--tint)}
.bnav a .npill{position:absolute;top:-2px;right:6px;height:16px;min-width:16px;font-size:10px;padding:0 4px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;line-height:1;color:var(--dangerOn);background:var(--danger);border-radius:var(--rF);box-shadow:0 0 0 2px var(--surf)}
.bnav a .dotb{position:absolute;top:0;right:12px;width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surf)}
/* edge-to-edge scrollers on a phone */
.win.w0 .tabs{margin-left:calc(-1*var(--bp));margin-right:calc(-1*var(--bp));padding:0 var(--bp)}
.tabs.fade{-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent)}
.chiprow.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1*var(--bp,0px));margin-right:calc(-1*var(--bp,0px));padding:0 var(--bp,0px)}
.chiprow.scroll::-webkit-scrollbar{display:none}
.chiprow.scroll>.fchip{flex:0 0 auto}
/* a sticky action bar for forms on a phone */
.abar{display:flex;gap:var(--s2);padding:10px var(--bp,16px) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surf);flex:0 0 auto}
.abar .btn{flex:1;height:44px}
/* search suggestions */
.sgl{display:flex;flex-direction:column}
.sgl .sgh{display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);padding:14px 2px 6px}
.sgl .sgh span{margin-left:auto;letter-spacing:0;text-transform:none;font-size:12px;font-weight:600;color:var(--brandInk);cursor:pointer}
.sgl a{display:flex;align-items:center;gap:var(--s3);min-height:46px;padding:8px 2px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink2);cursor:pointer}
.sgl a:first-of-type{border-top:0}
.sgl a .ic{color:var(--ter)}
.sgl a mark{background:transparent;color:var(--ink);font-weight:600}
.sgl a .go{margin-left:auto;color:var(--ter)}

/* ── phone-width rules for the existing system (.w0 < 600) ───────────────────────────── */
.win.w0 .body{--bp:16px}
.win.w0 .aside,.win.w0 .aside.wide{position:absolute;inset:0;width:100%;flex-basis:auto;z-index:15;border:0;box-shadow:none}
.win.w0 .titlehd h1{font-size:22px}
.win.w0 .titlehd{margin-bottom:var(--s5)}
.win.w0 .pagehd h1{font-size:21px}
.win.w0 .pagehd .fa{margin-left:0;padding-left:0}
.win.w0 .metarow{gap:var(--s2) var(--s3)}
.win.w0 .metarow .sp{display:none}
.win.w0 .toolrow .srch,.win.w0 .actbar .srch{width:100%!important;flex:1 1 100%}
.win.w0 .chiprow{gap:6px}
.win.w0 .actbar{gap:var(--s2)}
.win.w0 .g2,.win.w0 .dcols,.win.w0 .homegrid{grid-template-columns:minmax(0,1fr);gap:var(--s5)}
.win.w0 .tiles-sm{grid-template-columns:repeat(2,minmax(0,1fr))}
.win.w0 .btn{height:40px}
.win.w0 .btn.sm{height:34px}
.win.w0 .btn.ico{width:40px}
.win.w0 .btn.sm.ico{width:34px}
.win.w0 .tbtn{width:40px;height:40px}
.win.w0 .inp,.win.w0 .srch{height:42px}
.win.w0 .inp input,.win.w0 .inp textarea,.win.w0 .srch input,.win.w0 .addrow input{font-size:16px}
.win.w0 .inp.area{height:auto}
.win.w0 .row{padding:13px 10px}
.win.w0 .task{padding:12px 10px}
.win.w0 .nav a{height:44px}
.win.w0 .views a{min-height:44px}
.win.w0 .fchip{height:34px}
.win.w0 .seg span{height:28px;min-width:30px}
.win.w0 .stat .big{font-size:24px}
.win.w0 .doc-eyebrow{flex-wrap:wrap}
.win.w0 .fab{right:16px!important;bottom:76px!important}

/* ── fields & forms ──────────────────────────────────────────────────────────────────── */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>.fl{display:flex;align-items:baseline;gap:6px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter)}
.fld>.fl .rq{color:var(--dangerInk);font-weight:700;letter-spacing:0}
.fld>.fl .n{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.fld .hint{font-size:12px;line-height:1.5}
.fmsg{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.45;color:var(--dangerInk)}
.fmsg .ic{margin-top:1px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.fgrid>.wide{grid-column:1/-1}
.win.w0 .fgrid{grid-template-columns:minmax(0,1fr)}
.sidep .fgrid{grid-template-columns:minmax(0,1fr)}
.sidep.lg .fgrid,.sidep.xl .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.win.w0 .sidep.lg .fgrid,.win.w0 .sidep.xl .fgrid{grid-template-columns:minmax(0,1fr)}
.sel.full{display:flex;width:100%;height:34px;padding:0 11px;justify-content:space-between;font-size:13px;border-radius:var(--r2)}
.sel.full>span{display:inline-flex;align-items:center;gap:var(--s2);min-width:0}
.sel.full.err{border-color:var(--danger)}
.win.w0 .sel.full{height:42px;font-size:16px}
.fsub{display:flex;flex-direction:column;gap:var(--s3)}
.fsub>.fh{display:flex;align-items:baseline;gap:var(--s2);padding-bottom:var(--s2);border-bottom:1px solid var(--line)}
.fsub>.fh b{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter)}
.fsub>.fh span{font-size:12px;color:var(--ter)}
.fchk{display:flex;align-items:flex-start;gap:var(--s3);font-size:13px;color:var(--ink2);line-height:1.5;cursor:pointer}
.fchk .cbx,.fchk .rdo,.fchk .tog{margin-top:1px}
.fchk small{display:block;font-size:12px;color:var(--sec);margin-top:1px}
.kvl{display:flex;flex-direction:column}
.kvl>div{display:flex;align-items:flex-start;gap:var(--s4);padding:9px 0;border-top:1px solid var(--hair);min-width:0}
.kvl>div:first-child{border-top:0;padding-top:0}
.kvl .k{flex:0 0 36%;max-width:148px;font-size:12.5px;color:var(--ter);line-height:1.5}
.kvl .v{flex:1;min-width:0;font-size:13px;color:var(--ink2);line-height:1.5;overflow-wrap:anywhere;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.kvl.r .v{justify-content:flex-end;text-align:right}
.kvl.b>div:first-child{border-top:1px solid var(--hair);padding-top:9px}
/* a skeleton — the shape of what is loading */
.skel{display:block;height:10px;border-radius:5px;background:var(--hair);position:relative;overflow:hidden;flex:0 0 auto}
.skel:after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--sunk),transparent);animation:shim 1.5s ease-in-out infinite}
@keyframes shim{to{transform:translateX(100%)}}
.skel.c{width:28px;height:28px;border-radius:50%}
.skel.b{height:32px;border-radius:var(--r2)}

/* ── filter, sort and column controls ────────────────────────────────────────────────── */
.btn .nb{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-right:-3px;border-radius:var(--rF);background:var(--brandFill);color:var(--brandOn);font-size:11px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.btn.s.on{background:var(--tint2);color:var(--brandInk);border-color:var(--tint)}
.btn.s.on:hover{background:var(--tint)}
.btn.ico{position:relative}
.btn.ico .nb{position:absolute;top:-6px;right:-6px;margin:0;box-shadow:0 0 0 2px var(--surf)}
.dtapplied{display:flex;align-items:center;gap:var(--s2);padding:9px var(--s4);background:var(--rail);border-bottom:1px solid var(--hair);flex-wrap:wrap}
.dtapplied .lb{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);margin-right:var(--s1);white-space:nowrap}
.dtapplied .rs{margin-left:auto;font-size:12px;color:var(--sec);white-space:nowrap;font-variant-numeric:tabular-nums}
.dtapplied .rs b{color:var(--ink2);font-weight:600}
.achip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 3px 0 10px;font-size:12px;color:var(--brandInk);background:var(--tint);border-radius:var(--r2);white-space:nowrap;flex:0 0 auto}
.achip .k{color:var(--sec);font-weight:500}
.achip b{font-weight:600}
.achip .x{width:20px;height:20px;border-radius:var(--r1);display:inline-flex;align-items:center;justify-content:center;color:var(--brandInk);cursor:pointer;opacity:.7;transition:opacity var(--tr),background var(--tr)}
.achip .x:hover{opacity:1;background:var(--chipWell)}
.fsec{display:flex;flex-direction:column;gap:var(--s2);padding-top:var(--s5);border-top:1px solid var(--hair)}
.fsec:first-child{padding-top:0;border-top:0}
.fsec>.ghd{margin:0}
.fsec>.ghd .n b{color:var(--brandInk);font-weight:600}
.fopts{display:flex;flex-direction:column;margin:0 -8px}
.fo{display:flex;align-items:center;gap:var(--s3);min-height:34px;padding:0 8px;border-radius:var(--r2);font-size:13px;color:var(--ink2);cursor:pointer;transition:background var(--tr)}
.fo:hover{background:var(--sunk)}
.fo .c{margin-left:auto;font-size:12px;color:var(--ter);font-variant-numeric:tabular-nums}
.fo.on{color:var(--ink)}
.fo.on .lbl{font-weight:600}
.rng{display:flex;align-items:center;gap:var(--s2)}
.rng .inp{flex:1;min-width:0}
.rng>span{color:var(--ter);font-size:12.5px}
.sortlist{display:flex;flex-direction:column;margin:0 -10px}
.sr{display:flex;align-items:center;gap:var(--s3);min-height:50px;padding:6px 10px;border-radius:var(--r2);cursor:pointer;transition:background var(--tr)}
.sr:hover{background:var(--sunk)}
.sr.on{background:var(--tint2)}
.sr+.sr{border-top:1px solid var(--hair)}
.sr.on+.sr,.sr+.sr.on{border-top-color:transparent}
.sr .nm{flex:1;min-width:0;font-size:13.5px;color:var(--ink2)}
.sr .nm small{display:block;font-size:11.5px;color:var(--ter);margin-top:1px}
.sr.on .nm{color:var(--brandInk);font-weight:600}
.sr.on .nm small{font-weight:400;color:var(--sec)}
.dirseg{display:inline-flex;gap:2px;background:var(--sunk);border-radius:var(--r2);padding:2px;flex:0 0 auto}
.sr.on .dirseg{background:var(--surf);box-shadow:inset 0 0 0 1px var(--tint)}
.dirseg span{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:calc(var(--r2) - 2px);font-size:12px;font-weight:500;color:var(--ter);cursor:pointer;white-space:nowrap;transition:background var(--tr),color var(--tr)}
.dirseg span:hover{color:var(--ink2)}
.dirseg span.on{background:var(--brandFill);color:var(--brandOn);font-weight:600}
.dirseg span.on:hover{color:var(--brandOn)}
.colset{display:flex;flex-direction:column;margin:0 -10px}
.cs{display:flex;align-items:center;gap:var(--s2);min-height:42px;padding:3px 10px 3px 4px;border-radius:var(--r2);background:var(--surf);transition:background var(--tr)}
.cs:hover{background:var(--sunk)}
.cs .grip{width:26px;height:34px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;color:var(--ter);cursor:grab;flex:0 0 auto;touch-action:none}
.cs .grip:hover{color:var(--ink2)}
.cs .nm{flex:1;min-width:0;font-size:13.5px;color:var(--ink2)}
.cs .nm small{font-size:11.5px;color:var(--ter);margin-left:6px}
.cs .tbtn{width:28px;height:28px}
.cs.off .nm{color:var(--ter)}
.cs.off .grip{visibility:hidden}
.cs.lock{cursor:default}
.cs.lock .grip{color:var(--line2);cursor:not-allowed}
.cs.lock .nm{color:var(--ink2)}
.cs.pin{background:var(--sunk);margin-top:var(--s2)}
.cs.dragging{background:var(--tint2);box-shadow:var(--e2);position:relative;z-index:2}
.cs.dragging .grip{cursor:grabbing;color:var(--brandInk)}
.colset .cs:focus-within .grip,.cs .grip:focus-visible{color:var(--brandInk)}
.colnote{display:flex;gap:var(--s2);align-items:flex-start;font-size:12px;line-height:1.5;color:var(--sec);padding:2px 0}
.colnote .ic{margin-top:2px;color:var(--ter)}
/* a filter or sort popover anchored to one column header */
.cpop{position:absolute;z-index:22;width:252px;max-width:calc(100% - 16px);background:var(--surf);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--e2);animation:mnin .12s ease-out;display:flex;flex-direction:column}
.cpop .cph{display:flex;flex-direction:column;padding:var(--s1)}
.cpop .cph a{display:flex;align-items:center;gap:10px;height:32px;padding:0 var(--s2);border-radius:var(--r1);font-size:13px;color:var(--ink2);cursor:pointer}
.cpop .cph a:hover{background:var(--sunk)}
.cpop .cph a .ic{color:var(--ter)}
.cpop .cph a.on{color:var(--brandInk);font-weight:600}
.cpop .cph a.on .ic{color:var(--brandInk)}
.cpop .cpb{padding:var(--s3);border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:var(--s2);max-height:240px;overflow-y:auto}
.cpop .cpf{display:flex;gap:var(--s2);padding:var(--s3);border-top:1px solid var(--hair)}
.cpop .cpf .btn{flex:1}

/* ═══════════════════════════ data table ═══════════════════════════
   The .table foundation, grown into a family: a container that keeps horizontal
   scroll to itself, a toolbar, an applied-filters bar, a footer — and an Action
   column that is pinned to the right edge, always last, never reordered. */
.dt{container:dt/inline-size;border:1px solid var(--line);border-radius:var(--r4);background:var(--surf);display:flex;flex-direction:column;min-width:0;max-width:100%;overflow:hidden;position:relative}
.dt.flush{border:0;border-radius:0;background:transparent}
.dtbar{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s4);border-bottom:1px solid var(--hair);flex-wrap:wrap;min-height:58px;background:var(--surf)}
.dtbar .tt{display:flex;align-items:baseline;gap:var(--s2);min-width:0;margin-right:var(--s2)}
.dtbar .tt b{font-family:var(--f-head);font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.dtbar .tt .n{font-size:11px;font-weight:600;color:var(--sec);background:var(--sunk);border-radius:var(--rF);padding:2px 8px;line-height:1.5;white-space:nowrap;font-variant-numeric:tabular-nums}
.dtbar .srch{margin:0;height:32px;width:220px;flex:0 1 220px;min-width:120px}
.dtbar .fill{flex:1 1 0;min-width:0}
.dtbar .brk{display:none}
.dtbar .ov{display:none}
.dtbar .bsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.dtbar.bulk{background:var(--tint2);border-bottom-color:var(--tint);padding-top:9px;padding-bottom:9px}
.dtbar.bulk .tt b{color:var(--brandInk);font-weight:600}
.dtbar.bulk .tt .n{background:var(--chipWell);color:var(--brandInk)}
.dtbar.bulk .btn.s{background:var(--surf)}
.dtbar.bulk .btn.d.q{background:transparent;border-color:transparent;box-shadow:none;color:var(--dangerInk)}
.dtbar.bulk .btn.d.q:hover{background:var(--dangerTint)}
.dtbar.bulk .link .ln{display:none}
.dtwrap{overflow:auto;min-width:0;max-width:100%;position:relative;overscroll-behavior-x:contain}
.dtwrap.v{max-height:var(--dth,380px)}
.dt .table{border-collapse:separate;border-spacing:0;width:100%}
.dt .table th{height:38px;padding:0 var(--s3);white-space:nowrap;background:var(--surf);border-bottom:1px solid var(--line);text-align:left;position:relative}
.dt .table td{padding:11px var(--s3);white-space:nowrap;border-bottom:1px solid var(--hair);vertical-align:middle;background:var(--cbg,transparent)}
.dt .table tbody tr:last-child td{border-bottom:0}
.dt .table th:first-child,.dt .table td:first-child{padding-left:var(--s4)}
.dt .table th:last-child,.dt .table td:last-child{padding-right:var(--s4)}
.dt .table th.num,.dt .table td.num{text-align:right}
.dt .table td.tm{font-weight:600;color:var(--ink)}
.dt .table tbody tr:hover{--cbg:var(--sunk)}
.dt .table tbody tr.on{--cbg:var(--tint2)}
.dt .table tbody tr.on:hover{--cbg:var(--tint)}
.dt .table tbody tr:hover td{background:var(--cbg)}
.dt .table tbody tr.row-link{cursor:pointer}
.dt .table.dense th{height:32px}
.dt .table.dense td{padding:6px var(--s3);font-size:13px}
.dt .table.dense .cp .em{display:none}
.dt .table.dense .cp{gap:8px}
.dt .table .sc{width:44px;min-width:44px;padding:0 0 0 var(--s4)}
.dt .table .sc .cbx{display:flex}
.dt .table .cbx.mix{background:var(--brand);border-color:var(--brand);color:var(--brandOn)}
.dt .table .xp{width:34px;min-width:34px;padding-left:var(--s2);padding-right:0}
.dt .table .xp .tw{width:24px;height:24px;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;color:var(--ter);cursor:pointer}
.dt .table .xp .tw:hover{background:var(--line);color:var(--ink2)}
.dt .table .xp .tw svg{transition:transform .14s}
.dt .table .xp .tw.o svg{transform:rotate(90deg)}
.dt .table tr.xr>td{padding:0;background:var(--rail);border-bottom:1px solid var(--hair)}
.dt .table tr.xr:hover{--cbg:var(--rail)}
.dt .table tr.xr+tr td{border-top:0}
.xin{position:sticky;left:0;width:var(--dtw,100%);max-width:100%;padding:var(--s4) var(--s5) var(--s5) var(--s7);display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:var(--s4) var(--s6);white-space:normal}
.xin .k{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);display:block;margin-bottom:3px}
.xin .v{font-size:13px;color:var(--ink2);line-height:1.5;display:block}
.xin .xa{grid-column:1/-1;display:flex;gap:var(--s2)}
/* pinned columns — one table, never a second copy of it */
.dt .table .pl{position:sticky;left:0;z-index:2;background:var(--cbg,var(--surf));transition:box-shadow var(--tr)}
.dt .table .pl2{left:44px}
.dt .table .pl.last{border-right:1px solid transparent}
.dt .table .act{position:sticky;right:0;z-index:2;width:1px;text-align:right;background:var(--cbg,var(--surf));transition:box-shadow var(--tr)}
.dt .table th.act,.dt .table th.pl{z-index:4}
.dt .table th.act{padding-left:var(--s3)}
.dtwrap[data-sr] .table .act{box-shadow:var(--stickShadow)}
.dtwrap[data-sl] .table .pl.last{box-shadow:var(--stickShadowL)}
.dtwrap.v .table th{position:sticky;top:0;z-index:3}
.dtwrap.v .table th.act,.dtwrap.v .table th.pl{z-index:5}
.dtwrap[data-st] .table th{box-shadow:0 6px 8px -6px rgba(16,24,40,.16)}
[data-theme="dark"] .dtwrap[data-st] .table th{box-shadow:0 6px 8px -6px rgba(0,0,0,.6)}
.dtwrap[data-st] .table th.act{box-shadow:var(--stickShadow)}
/* header controls: sort and filter, only where they are useful */
.dt .table th.s{cursor:pointer;user-select:none}
.dt .table th.s:hover{color:var(--ink2)}
.dt .table th .hl{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.dt .table th .si{display:inline-flex;color:var(--ter);opacity:0;transition:opacity var(--tr),color var(--tr)}
.dt .table th.s:hover .si,.dt .table th.s:focus-visible .si{opacity:.9}
.dt .table th[aria-sort]{color:var(--ink2)}
.dt .table th[aria-sort] .si{opacity:1;color:var(--brandInk)}
.dt .table th .hb{width:22px;height:22px;border-radius:var(--r1);display:inline-flex;align-items:center;justify-content:center;color:var(--ter);margin-left:2px;vertical-align:middle;cursor:pointer;opacity:0;transition:opacity var(--tr),background var(--tr),color var(--tr)}
.dt .table th:hover .hb,.dt .table th:focus-within .hb,.dt .table th .hb.on,.dt .table th .hb:focus-visible{opacity:1}
.dt .table th .hb:hover{background:var(--sunk);color:var(--ink2)}
.dt .table th .hb.on{color:var(--brandInk);background:var(--tint2)}
@media (hover:none){.dt .table th .hb,.dt .table th.s .si{opacity:1}}
.dt .table th.num .hl{flex-direction:row-reverse}
/* cell primitives */
.cp{display:flex;align-items:center;gap:10px;min-width:0}
.cp .nm{display:block;font-weight:600;color:var(--ink);font-size:13.5px;line-height:1.3}
.cp .em{display:block;font-size:12px;color:var(--ter);line-height:1.3;margin-top:1px}
.cst{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.cst.ok .ic{color:var(--okInk)}.cst.warn .ic{color:var(--warnInk)}.cst.dg .ic{color:var(--dangerInk)}.cst.mute .ic{color:var(--ter)}.cst.info .ic{color:var(--infoInk)}
.cprog{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sec);font-variant-numeric:tabular-nums}
.cprog i{display:block;width:64px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.cprog i b{display:block;height:100%;border-radius:3px;background:var(--brandFill);opacity:.8}
.cprog.hi i b{background:var(--ok)}
.dtd{color:var(--sec);font-variant-numeric:tabular-nums}
.racts{display:inline-flex;gap:1px;align-items:center}
.racts>span{width:28px;height:28px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;color:var(--ter);cursor:pointer;transition:background var(--tr),color var(--tr)}
.racts>span:hover{background:var(--tint2);color:var(--brandInk)}
.racts>span.dg:hover{background:var(--dangerTint);color:var(--dangerInk)}
.dt .table .acthd{font-size:0}
.dtfoot{display:flex;align-items:center;gap:var(--s3);padding:9px var(--s4);border-top:1px solid var(--line);font-size:12.5px;color:var(--sec);flex-wrap:wrap;background:var(--surf);min-height:50px}
.dtfoot .rs{font-variant-numeric:tabular-nums}
.dtfoot .rs b{color:var(--ink2);font-weight:600}
.dtfoot .pp{display:inline-flex;align-items:center;gap:var(--s2)}
.dtfoot .pg{display:flex;gap:2px;margin-left:auto;align-items:center}
.dtfoot .pgn{min-width:28px;height:28px;padding:0 6px;border-radius:var(--r2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;color:var(--sec);cursor:pointer;font-variant-numeric:tabular-nums;transition:background var(--tr),color var(--tr)}
.dtfoot .pgn:hover{background:var(--sunk);color:var(--ink2)}
.dtfoot .pgn.on{background:var(--tint);color:var(--brandInk);font-weight:600}
.dtfoot .pgn.dis{color:var(--line2);cursor:not-allowed}
.dtfoot .pgn.dis:hover{background:transparent;color:var(--line2)}
.dtfoot .gap{color:var(--ter);padding:0 2px}
.dtfoot .more{margin:0 auto}
/* states of the body */
.dtstate{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px var(--s5);gap:var(--s2);min-height:200px}
.dtstate .ico{width:40px;height:40px;border-radius:var(--r3);background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--ter);margin-bottom:var(--s2)}
.dtstate.dg .ico{background:var(--dangerTint);color:var(--dangerInk)}
.dtstate b{font-family:var(--f-head);font-size:15px;font-weight:600}
.dtstate p{font-size:13px;color:var(--sec);max-width:340px;line-height:1.55}
.dtstate .a{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap;justify-content:center}
.dt .table.load td{padding-top:15px;padding-bottom:15px}
/* mobile representations — the same data, a different shape */
.rcards{display:none}
.rcard{display:flex;gap:var(--s3);padding:13px var(--s4);border-bottom:1px solid var(--hair);cursor:pointer;transition:background var(--tr);align-items:flex-start}
.rcard:last-child{border-bottom:0}
.rcard:hover{background:var(--sunk)}
.rcard.on{background:var(--tint2)}
.rcard .cbx{margin-top:2px}
.rcard .bd{flex:1;min-width:0}
.rcard .hd{display:flex;align-items:center;gap:var(--s2);min-width:0}
.rcard .nm{font-family:var(--f-head);font-size:14px;font-weight:600;letter-spacing:-.005em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .sb{font-size:12px;color:var(--ter);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .kv2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:10px}
.rcard .kv2 span{display:block;font-size:11px;color:var(--ter);line-height:1.3}
.rcard .kv2 b{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.rcard .kb2{width:32px;height:32px;margin:-4px -8px 0 0;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;color:var(--ter);flex:0 0 auto}
.rcard>.ic{color:var(--ter);flex:0 0 auto;margin-top:2px;opacity:.6}
/* ── responsive table — decided by the room the table itself has, so it adapts in a narrow pane exactly as it does on a phone ── */
.dt>.dtbar,.dt>.dtapplied,.dt>.dtfoot,.dt>.tabs{flex:0 0 auto}
@container dt (max-width:900px){
 .dtbar .btn.hm .tx.hid{display:none}
 .dtbar .btn.hm.q{padding:0;width:32px}
 .dtbar .srch{flex-basis:190px}
}
@container dt (max-width:740px){
 .dtbar .hm{display:none}
 .dtbar .ov{display:inline-flex}
 .dtbar .btn .tx.hid{display:none}
 .dtbar .srch{flex:1 1 160px;width:auto}
}
@container dt (max-width:760px){.dt.m-prio [data-p="3"]{display:none}}
@container dt (max-width:560px){
 .dt.m-prio [data-p="2"]{display:none}
 .dt.m-prio .racts.hm1>span:not(:last-child),.dt.m-scroll .racts.hm1>span:not(:last-child){display:none}
 .dtbar{padding:10px var(--s3);gap:var(--s2)}
 .dtbar .tt{order:1;flex:1 1 0;margin-right:0}
 .dtbar .add{order:1}
 .dtbar .brk{display:block;order:2;flex:0 0 100%;height:0}
 .dtbar .srch{order:3;flex:1 1 120px;width:auto;height:38px}
 .dtbar .btn.filter,.dtbar .btn.sort,.dtbar .ov{order:3}
 .dtbar .hm,.dtbar .bsep{display:none}
 .dtbar .btn .tx{display:none}
 .dtbar .btn.s{padding:0;width:38px;height:38px;position:relative}
 .dtbar .btn.s .nb{position:absolute;top:-5px;right:-5px;margin:0;box-shadow:0 0 0 2px var(--surf)}
 .dtbar .btn.add{width:auto;padding:0 13px;height:38px}
 .dtbar .btn.add.ico{width:38px;padding:0}
 .dtbar .btn.add .tx{display:inline}
 .dtbar.bulk{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .dtbar.bulk .btn{flex:0 0 auto;width:38px;height:38px;padding:0}
 .dtbar.bulk .link .lw{display:none}
 .dtbar.bulk .link .ln{display:inline}
 .dtbar.bulk .brk{display:none}
 .dtbar.bulk .tt{flex:0 0 auto;order:0}
 .dtbar.bulk .link{flex:0 0 auto;white-space:nowrap}
 .dtapplied{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px var(--s3)}
 .dtapplied::-webkit-scrollbar{display:none}
 .dtapplied .lb,.dtapplied .rs{display:none}
 .dtapplied .link{flex:0 0 auto;white-space:nowrap}
 .dt .table td{padding-top:13px;padding-bottom:13px}
 .dt .table th[style*="min-width"]{min-width:132px!important}
 .dt.m-prio td .cp .nm,.dt.m-scroll td .cp .nm{max-width:calc(var(--dtw,390px) - 262px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .dt.m-prio td .cp>span:last-child,.dt.m-scroll td .cp>span:last-child{min-width:0}
 .dt.m-cards .dtwrap{display:none}
 .dt.m-cards .rcards{display:block}
 .dt.m-stack .table,.dt.m-stack tbody,.dt.m-stack tr,.dt.m-stack td{display:block}
 .dt.m-stack thead{display:none}
 .dt.m-stack tr{padding:var(--s3) var(--s4);border-bottom:1px solid var(--hair);position:relative}
 .dt.m-stack td{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);padding:5px 0;border:0;white-space:normal;text-align:right;background:transparent}
 .dt.m-stack td:before{content:attr(data-l);font-size:12px;color:var(--ter);text-align:left;flex:0 0 auto}
 .dt.m-stack td.sc,.dt.m-stack td.xp{display:none}
 .dt.m-stack td.kc{font-size:14px;padding-bottom:8px;text-align:left;justify-content:flex-start}
 .dt.m-stack td.kc:before{display:none}
 .dt.m-stack td.act{position:static;box-shadow:none!important;width:auto;padding-top:8px;justify-content:flex-end}
 .dt.m-stack td.act:before{display:none}
 .dtfoot{padding:8px var(--s3);justify-content:space-between}
 .dtfoot .pgn:not(.pn){display:none}
 .dtfoot .pp{display:none}
 .dtfoot .pg{margin:0 auto}
 .dtfoot .rs{margin:0 auto;order:2}
}
.win.w0 .dt{border-left:0;border-right:0;border-radius:0}
/* the little rows used to explain what is behind a specimen */
.faux{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s5)}
.faux .skel:nth-child(odd){width:72%}
.faux .skel:nth-child(even){width:54%}

/* ── small utilities for the v0.9 layer ─────────────────────────────────────────────── */
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ovg.out,.ovg.out>*{pointer-events:none}
.spf .sp-l.dg{color:var(--dangerInk);font-weight:600}
.toast .tl{margin-left:var(--s3);font-weight:600;color:inherit;text-decoration:underline;cursor:pointer;pointer-events:auto}
.toasts .toast{pointer-events:auto}
.win.w0 .toasts{bottom:76px;max-width:calc(100% - 24px)}
.win.w0 .toasts .toast{white-space:normal}
.fsm.msrch .fb{padding:var(--s2) var(--s4)}
.fsm.msrch>.mbar{flex:0 0 auto}
.menu.dyn{animation:mnin .12s ease-out}
.dt>.tabs{padding:var(--s2) var(--s4) 0;margin:0;gap:var(--s5);background:var(--surf)}
.dt>.dtwrap{flex:1 1 auto;min-height:0}
.pg-in>.dt{flex:1 1 auto;min-height:0}
.win.w0 .dt>.tabs{padding:var(--s1) var(--s3) 0;gap:var(--s4)}
/* a record's activity, as a hairline timeline */
.tl{display:flex;flex-direction:column}
.tli{display:flex;gap:var(--s3);position:relative;padding-bottom:var(--s5)}
.tli:last-child{padding-bottom:0}
.tli:not(:last-child):before{content:'';position:absolute;left:11.5px;top:28px;bottom:4px;width:1px;background:var(--line)}
.tld{width:24px;height:24px;border-radius:50%;background:var(--sunk);color:var(--sec);display:flex;align-items:center;justify-content:center;flex:0 0 auto;z-index:1}
.tli.on .tld{background:var(--brandFill);color:var(--brandOn)}
.tli.ok .tld{background:var(--okTint);color:var(--okInk)}
.tli.dg .tld{background:var(--dangerTint);color:var(--dangerInk)}
.tli.wait .tld{background:var(--surf);box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--ter)}
.tli>span:last-child{min-width:0;flex:1}
.tli b{display:block;font-size:13px;font-weight:600;color:var(--ink);line-height:1.45}
.tli small{display:block;font-size:12px;color:var(--ter);margin-top:1px;line-height:1.5}
.tli p{font-size:13px;line-height:1.55;color:var(--ink2);margin-top:6px}
/* the phone shell's screens: a list and a detail that replace each other */
.shell.m[data-screen] .scr{display:none;flex:1 1 auto;min-height:0;flex-direction:column}
.shell.m[data-screen="list"] .scr.list,.shell.m[data-screen="detail"] .scr.detail{display:flex}
.shell.m>.app{flex:1;min-height:0;flex-direction:column}
.shell.m>.app>.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.shell.m>.app>.main>.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.fwrap{display:flex;flex-wrap:wrap;gap:var(--s6);align-items:flex-start}
.fwrap>.fcol{display:flex;flex-direction:column;gap:var(--s2);min-width:0;max-width:100%}
.fwrap>.fcol>small{font-size:11.5px;color:var(--ter);font-family:var(--f-mono)}
.pg-in.flush{padding:0;gap:0;background:var(--surf)}
.pg-in.flush>.dt{border:0;border-radius:0}
.specs.one{grid-template-columns:minmax(0,1fr)}

/* ═══════════════════════════ layout vocabulary (v0.9) ═══════════════════════════
   Shells, KPI strips, facets, boards, calendars, steppers, feeds, compare panes. Everything is built
   from the tokens and the existing components; nothing here names a colour or a product. */

/* ── shells: top navigation and the focused flow ── */
.shell.t>.topnav{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:var(--s5);padding:0 var(--s6);background:var(--surf);border-bottom:1px solid var(--line);z-index:6;min-width:0}
.topnav .tnav{display:flex;gap:2px;margin-left:var(--s2)}
.topnav .tnav a{position:relative;height:34px;padding:0 var(--s3);display:flex;align-items:center;font-size:13.5px;font-weight:500;color:var(--sec);border-radius:var(--r2);cursor:pointer;transition:background var(--tr),color var(--tr)}
.topnav .tnav a:hover{background:var(--sunk);color:var(--ink)}
.topnav .tnav a.on{color:var(--ink);font-weight:600}
.topnav .tnav a.on:after{content:'';position:absolute;left:var(--s3);right:var(--s3);bottom:-13px;height:2px;border-radius:2px;background:var(--brand)}
.topnav .srch{width:min(340px,32%);margin-left:auto;flex:0 1 340px}
.topnav .r{display:flex;gap:var(--s1);flex:0 0 auto}
.topnav.c{padding:0 var(--s3);gap:var(--s3)}
.topnav.c .srch{flex:1;width:auto}
.shell.t .tmain{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surf)}
.shell.t .tmain>.body{--bp:var(--s7);width:100%;max-width:1280px;margin:0 auto}
.win.w2 .shell.t .tmain>.body{--bp:var(--s6)}
.shell.f>.fhead{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4) 0 var(--s3);border-bottom:1px solid var(--line)}
.fhead .ft{display:flex;flex-direction:column;min-width:0;flex:1}
.fhead .ft b{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.fhead .ft small{font-size:12px;color:var(--ter)}
.fhead .r{display:flex;gap:var(--s2);align-items:center}
.shell.f>.fbody{flex:1;min-height:0;overflow-y:auto;padding:var(--s7) var(--s6);background:var(--surf)}
.shell.f>.fbody>.fin{width:100%;max-width:960px;margin:0 auto}
.shell.f>.ffoot{flex:0 0 auto;display:flex;align-items:center;gap:var(--s2);padding:12px var(--s6) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surf)}
.shell.f>.ffoot .sp-l{margin-right:auto;font-size:12.5px;color:var(--sec)}
.win.w1 .shell.f>.fbody{padding:var(--s6) var(--s5)}
.win.w0 .shell.f>.fbody{padding:var(--s5) var(--s4)}
.win.w0 .shell.f>.ffoot{padding:10px var(--s4) calc(12px + env(safe-area-inset-bottom,0px))}
.win.w0 .shell.f>.ffoot .btn{flex:1;height:44px}
.win.w0 .shell.f>.ffoot .sp-l{display:none}
.body.tight{padding:0;overflow:hidden}
.body.tight>.dt{flex:1 1 auto;min-height:0;border:0;border-radius:0}
.body.tight>.titlehd{padding:var(--bp) var(--bp) 0;margin-bottom:var(--s5)}
.tbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s5)}
.tbar .r{margin-left:auto;display:flex;gap:var(--s2);align-items:center}

/* ── grids ── */
.cols{display:grid;gap:var(--s5);align-items:start;min-width:0}
.cols>*{min-width:0}
.cols.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cols.c32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.cols.c12{grid-template-columns:minmax(0,1fr) 360px}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.stk{display:flex;flex-direction:column}
.win.w2 .cols.c21,.win.w2 .cols.c32,.win.w2 .cols.c12{grid-template-columns:minmax(0,1fr)}
.win.w1 .cols.c3{grid-template-columns:minmax(0,1fr)}
.stackv{display:flex;flex-direction:column;gap:var(--s5);min-width:0}

/* ── KPI strip: a label, a figure, a delta and a hairline trend — separated by hairlines, not boxes ── */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:var(--s6);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:var(--s4) var(--s5);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'lb lb' 'v s' 'd s';column-gap:var(--s3);align-content:start;min-width:0}
.kpi:first-child{padding-left:0}
.kpi+.kpi{border-left:1px solid var(--hair)}
.kpi .lb{grid-area:lb;font-size:12px;color:var(--ter);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{grid-area:v;font-family:var(--f-head);font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .d{grid-area:d;font-size:12px;color:var(--sec);display:flex;align-items:center;gap:4px;margin-top:7px;white-space:nowrap}
.kpi .d.ok{color:var(--okInk)}.kpi .d.dg{color:var(--dangerInk)}.kpi .d.warn{color:var(--warnInk)}
.kpi .spk{grid-area:s;align-self:end;margin-bottom:2px}
.win.w2 .kpi .v{font-size:24px}
.win.w2 .kpi .spk{display:none}
.win.w1 .kpis,.win.w0 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.win.w1 .kpi:nth-child(3),.win.w0 .kpi:nth-child(3){border-left:0;padding-left:0}
.win.w1 .kpi:nth-child(n+3),.win.w0 .kpi:nth-child(n+3){border-top:1px solid var(--hair)}
.win.w0 .kpi{padding:var(--s3) var(--s3)}
.win.w0 .kpi:nth-child(odd){padding-left:0}
.win.w0 .kpi .v{font-size:22px}
/* a ranked list with a bar — used where a chart would be too much */
.rank{display:flex;flex-direction:column}
.rank .rk{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;align-items:center;gap:var(--s3);padding:9px 0;border-top:1px solid var(--hair);font-size:13px}
.rank .rk:first-child{border-top:0}
.rank .rk .nm{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rk .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.rank .rk .bar i{display:block;height:100%;background:var(--cI,var(--brandFill));opacity:.8;border-radius:3px}
.rank .rk .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.win.w0 .rank .rk{grid-template-columns:minmax(0,1fr) 72px 56px}
/* SLA countdown row */
.sla{display:flex;align-items:center;gap:var(--s3);padding:11px 0;border-top:1px solid var(--hair)}
.sla:first-child{border-top:0}
.sla .bd{flex:1;min-width:0}
.sla .bd b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sla .bd span{display:block;font-size:12px;color:var(--ter)}
.sla .tm{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:600;color:var(--ink2);flex:0 0 auto}
.sla .tm.dg{color:var(--dangerInk)}.sla .tm.warn{color:var(--warnInk)}

/* ── facets + results ── */
.srl{display:grid;grid-template-columns:236px minmax(0,1fr);gap:var(--s7);align-items:start}
.win.w1 .srl,.win.w0 .srl{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
.win.w1 .srl>.facets,.win.w0 .srl>.facets{display:none}
.facets{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.facets .fgrp{display:flex;flex-direction:column;gap:var(--s1);padding-top:var(--s5);border-top:1px solid var(--hair)}
.facets .fgrp:first-child{padding-top:0;border-top:0}
.facets .fgrp>.ghd{margin-bottom:var(--s1)}
.facets .fo{min-height:30px;font-size:13px}
.facets .more{font-size:12px;font-weight:600;color:var(--brandInk);padding:4px 8px;cursor:pointer}
.mfbar{display:none}
.win.w1 .mfbar,.win.w0 .mfbar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.hits{display:flex;flex-direction:column}
.hit{padding:var(--s4) 0;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:5px;cursor:pointer}
.hit:first-child{border-top:0;padding-top:0}
.hit .path{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ter);min-width:0;overflow:hidden;white-space:nowrap}
.hit .path .ic{flex:0 0 auto}
.hit h3{font-family:var(--f-head);font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--brandInk);line-height:1.35}
.hit:hover h3{text-decoration:underline}
.hit p{font-size:13.5px;line-height:1.6;color:var(--ink2);max-width:76ch}
.hit mark,.sgl mark{background:var(--tint);color:var(--ink);border-radius:3px;padding:0 2px}
.hit .mt{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;font-size:12px;color:var(--ter)}
.resbar{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);font-size:13px;color:var(--sec);flex-wrap:wrap}
.resbar b{color:var(--ink);font-weight:600}
.resbar .r{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.sugg{font-size:13px;color:var(--sec);margin-bottom:var(--s4)}
.sugg .link{font-size:13px}

/* ── product cards ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:var(--s6) var(--s5)}
.win.w0 .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5) var(--s3)}
.prod{display:flex;flex-direction:column;gap:var(--s2);cursor:pointer;min-width:0}
.pimg{aspect-ratio:4/3.1;border-radius:var(--r4);background:var(--cT);color:var(--cI);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid var(--hair)}
.pimg .tag{position:absolute;left:10px;top:10px;background:var(--surf);color:var(--ink2);font-weight:600;padding:2px 8px;border-radius:var(--rF)}
.pimg .fav{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--surf);color:var(--sec);display:flex;align-items:center;justify-content:center;box-shadow:var(--e1)}
.prod:hover .pimg{box-shadow:var(--e2)}
.prod .nm{font-family:var(--f-head);font-size:14.5px;font-weight:600;letter-spacing:-.005em;line-height:1.35;margin-top:2px}
.prod .sb{font-size:12.5px;color:var(--ter);line-height:1.4}
.prod .pr{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.prod .pr s{font-weight:400;color:var(--ter);font-size:12.5px}
.prod .pr .off{font-size:11.5px;color:var(--okInk);font-weight:600}
.stars{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.stars i{display:inline-flex;gap:1px;color:var(--warn)}
.cathd{display:flex;align-items:flex-end;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.cathd h1{font-family:var(--f-head);font-size:30px;font-weight:600;letter-spacing:-.022em;line-height:1.15}
.cathd p{font-size:14px;color:var(--sec);margin-top:6px;max-width:60ch;line-height:1.6}
.cathd .r{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.pager2{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:var(--s7)}
.pager2 span{min-width:34px;height:34px;border-radius:var(--r2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--sec);cursor:pointer;font-variant-numeric:tabular-nums}
.pager2 span:hover{background:var(--sunk)}
.pager2 span.on{background:var(--tint);color:var(--brandInk);font-weight:600}

/* ── activity feed ── */
.feed{display:flex;flex-direction:column}
.feed .fday{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);padding:var(--s5) 0 var(--s2);border-bottom:1px solid var(--line)}
.feed .fday:first-child{padding-top:0}
.fi{display:flex;gap:var(--s3);padding:13px 0;border-bottom:1px solid var(--hair);position:relative;cursor:pointer}
.fi .ai{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--sunk);color:var(--sec)}
.fi .ai.av{color:#fff;font-weight:600;font-size:13px}
.fi.ok .ai{background:var(--okTint);color:var(--okInk)}.fi.dg .ai{background:var(--dangerTint);color:var(--dangerInk)}.fi.warn .ai{background:var(--warnTint);color:var(--warnInk)}.fi.info .ai{background:var(--infoTint);color:var(--info)}
.fi .bd{flex:1;min-width:0}
.fi .tx{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.fi .tx b{color:var(--ink);font-weight:600}
.fi .tx .lk{color:var(--brandInk);font-weight:500}
.fi .q{margin-top:6px;padding:8px 12px;border-left:2px solid var(--line2);font-size:13px;color:var(--sec);line-height:1.55;background:var(--rail);border-radius:0 var(--r2) var(--r2) 0}
.fi .mt{font-size:12px;color:var(--ter);margin-top:3px;display:flex;gap:var(--s2);align-items:center}
.fi .acts2{display:flex;gap:var(--s2);margin-top:9px}
.fi.un:before{content:'';position:absolute;left:-14px;top:22px;width:7px;height:7px;border-radius:50%;background:var(--brandFill)}
.win.w0 .fi.un:before{left:-10px}

/* ── master / detail inside the main column ── */
.msplit{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);flex:1;min-height:0}
.win.w1 .msplit{grid-template-columns:minmax(260px,300px) minmax(0,1fr)}
.msplit>.mlist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.mlist .mh{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s4);border-bottom:1px solid var(--hair);flex:0 0 auto}
.mlist .mh .srch{flex:1;height:32px}
.mlist .mh .tbtn{flex:0 0 auto}
.mlist .mt2{display:flex;gap:var(--s4);padding:0 var(--s4);border-bottom:1px solid var(--line);flex:0 0 auto}
.mlist .mt2 a{padding:10px 0 9px;font-size:13px;font-weight:500;color:var(--sec);border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
.mlist .mt2 a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--brand)}
.mlist .mt2 a .cnt{font-size:11px;font-weight:600;background:var(--sunk);color:var(--sec);border-radius:var(--r1);padding:1px 6px}
.mlist .ml{flex:1;min-height:0;overflow-y:auto}
.mrow{display:flex;gap:var(--s3);padding:13px var(--s4);border-bottom:1px solid var(--hair);cursor:pointer;position:relative;transition:background var(--tr)}
.mrow:hover{background:var(--sunk)}
.mrow.on{background:var(--tint2)}
.mrow.on:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brandFill)}
.mrow .avat{flex:0 0 auto;margin-top:1px}
.mrow .bd{flex:1;min-width:0}
.mrow .l1{display:flex;align-items:baseline;gap:var(--s2)}
.mrow .l1 b{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .l1 small{font-size:11.5px;color:var(--ter);flex:0 0 auto;font-variant-numeric:tabular-nums}
.mrow .l2{font-size:13px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .l3{font-size:12.5px;color:var(--ter);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.mrow.rd .l1 b,.mrow.rd .l2{font-weight:400}
.mrow.un .l2{font-weight:600;color:var(--ink)}
.mrow .dot{width:8px;height:8px;border-radius:50%;background:var(--brandFill);flex:0 0 auto;margin-top:6px}
.mdet{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.mdet>.dh{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s5) var(--s6) var(--s4);border-bottom:1px solid var(--line);flex:0 0 auto}
.mdet>.dh h2{font-family:var(--f-head);font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.mdet>.dh .sub{font-size:12.5px;color:var(--sec);margin-top:4px;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.mdet>.dh .r{margin-left:auto;display:flex;gap:2px;flex:0 0 auto}
.mdet>.db{flex:1;min-height:0;overflow-y:auto;padding:var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
.mdet>.df{flex:0 0 auto;padding:var(--s3) var(--s6) var(--s4);border-top:1px solid var(--line)}
.win.w0 .mdet>.dh,.win.w0 .mdet>.db,.win.w0 .mdet>.df{padding-left:var(--s4);padding-right:var(--s4)}
.msg2{display:flex;gap:var(--s3)}
.msg2 .avat{flex:0 0 auto}
.msg2 .bd{flex:1;min-width:0}
.msg2 .who{display:flex;align-items:baseline;gap:var(--s2);font-size:13px}
.msg2 .who b{font-weight:600;color:var(--ink)}
.msg2 .who small{color:var(--ter);font-size:12px}
.msg2 p{font-size:13.5px;line-height:1.65;color:var(--ink2);margin-top:6px;max-width:70ch}
.msg2 p+p{margin-top:10px}
.win.w0 .msplit{grid-template-columns:minmax(0,1fr)}
.win.w0 .msplit>.mlist{border-right:0}

/* ── profile ── */
.prof{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.prof .big{width:64px;height:64px;border-radius:var(--r4);font-size:26px;display:flex;align-items:center;justify-content:center;color:var(--cI);background:var(--cT);flex:0 0 auto}
.prof .ft{flex:1;min-width:200px}
.prof h1{font-family:var(--f-head);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.prof .sub{font-size:13px;color:var(--sec);margin-top:5px;display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}
.prof .fa{display:flex;gap:var(--s2);margin-left:auto}
.win.w0 .prof .big{width:52px;height:52px;font-size:21px}
.win.w0 .prof .fa{margin-left:0;width:100%}
.win.w0 .prof .fa .btn{flex:1}
.pdet{display:flex;flex-direction:column;gap:var(--s6)}
.health{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:var(--rF);padding:2px 9px 2px 7px}
.health i{width:7px;height:7px;border-radius:50%;background:currentColor}
.health.ok{background:var(--okTint);color:var(--okInk)}.health.warn{background:var(--warnTint);color:var(--warnInk)}.health.dg{background:var(--dangerTint);color:var(--dangerInk)}
.contact{display:flex;align-items:center;gap:var(--s3);padding:10px 0;border-top:1px solid var(--hair)}
.contact:first-child{border-top:0}
.contact .bd{flex:1;min-width:0}
.contact .bd b{display:block;font-size:13.5px;font-weight:600}
.contact .bd span{display:block;font-size:12px;color:var(--ter);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal{display:flex;align-items:center;gap:var(--s3);padding:11px 0;border-top:1px solid var(--hair)}
.deal:first-child{border-top:0}
.deal .bd{flex:1;min-width:0}
.deal .bd b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal .bd span{font-size:12px;color:var(--ter)}
.deal .amt{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px}

/* ── kanban ── */
.kan{display:flex;gap:var(--s4);overflow-x:auto;flex:1;min-height:0;padding:0 var(--bp,28px) var(--bp,28px);margin:0 calc(-1*var(--bp,28px));scrollbar-width:thin}
.kcol{width:292px;flex:0 0 292px;display:flex;flex-direction:column;background:var(--rail);border:1px solid var(--hair);border-radius:var(--r4);min-height:0;max-height:100%}
.kh{display:flex;align-items:center;gap:var(--s2);padding:12px var(--s3) 8px var(--s4);flex:0 0 auto}
.kh b{font-family:var(--f-head);font-size:13.5px;font-weight:600}
.kh .n{font-size:11px;font-weight:600;color:var(--sec);background:var(--chipWell,var(--sunk));border-radius:var(--rF);padding:1px 8px}
.kh .tot{margin-left:auto;font-size:12px;color:var(--sec);font-variant-numeric:tabular-nums}
.kh .dotc{width:8px;height:8px;border-radius:50%;background:var(--cI,var(--ter))}
.kcards{display:flex;flex-direction:column;gap:var(--s2);padding:0 var(--s2) var(--s2);overflow-y:auto;min-height:0}
.kcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r3);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);cursor:grab;transition:box-shadow var(--tr),border-color var(--tr)}
.kcard:hover{border-color:var(--line2);box-shadow:var(--e1)}
.kcard.drag{box-shadow:var(--e2);transform:rotate(1.2deg);border-color:var(--brand);opacity:.96}
.kcard .t{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
.kcard .s{font-size:12px;color:var(--ter)}
.kcard .m{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--sec);font-variant-numeric:tabular-nums}
.kcard .m .amt{font-weight:600;color:var(--ink2)}
.kcard .m .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.kcard .m .late{color:var(--dangerInk);font-weight:600}
.kdrop{border:1.5px dashed var(--line2);border-radius:var(--r3);height:56px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ter)}
.kadd{display:flex;align-items:center;gap:6px;padding:8px var(--s3);font-size:12.5px;color:var(--ter);cursor:pointer;margin:0 var(--s2) var(--s2);border-radius:var(--r2)}
.kadd:hover{background:var(--sunk);color:var(--ink2)}
.win.w0 .kan{scroll-snap-type:x mandatory;padding:0 var(--s4) var(--s4);margin:0 calc(-1*var(--bp,16px));scroll-padding:0 var(--s4)}
.win.w0 .kcol{flex-basis:84%;width:84%;scroll-snap-align:start}

/* ── calendar ── */
.cal{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r4);background:var(--surf);overflow:hidden;min-width:0}
.cal .ch{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid var(--line);border-left:1px solid var(--hair);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);gap:2px}
.cal .ch b{font-family:var(--f-head);font-size:18px;letter-spacing:-.01em;color:var(--ink);font-weight:600;text-transform:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal .ch.today b{background:var(--brandFill);color:var(--brandOn)}
.cal .ch.today{color:var(--brandInk)}
.cal .ch:first-child{border-left:0}
.cal .gut{display:flex;flex-direction:column}
.cal .gut span{height:56px;font-size:11px;color:var(--ter);text-align:right;padding:0 8px;transform:translateY(-7px);font-variant-numeric:tabular-nums}
.cal .gut span:first-child{visibility:hidden}
.cal .dc{position:relative;border-left:1px solid var(--hair);background-image:linear-gradient(var(--hair) 1px,transparent 1px);background-size:100% 56px}
.cal .dc.today{background-color:var(--tint2)}
.cal .ev{position:absolute;left:3px;right:3px;border-radius:var(--r2);padding:5px 8px;font-size:12px;line-height:1.35;overflow:hidden;background:var(--cT);color:var(--cI);border-left:3px solid var(--cI);cursor:pointer}
.cal .ev b{display:block;font-weight:600;color:var(--ink);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev span{display:block;color:var(--sec);font-size:11.5px;font-variant-numeric:tabular-nums}
.cal .now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--danger);z-index:2}
.cal .now:before{content:'';position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.calbar{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.calbar h2{font-family:var(--f-head);font-size:18px;font-weight:600;letter-spacing:-.014em}
.calbar .r{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.mon{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;background:var(--surf)}
.mon .mh2{height:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);border-bottom:1px solid var(--line)}
.mon .md{min-height:92px;padding:6px 8px;border-left:1px solid var(--hair);border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:3px;font-size:12px;cursor:pointer;min-width:0}
.mon .md:nth-child(7n+8){border-left:0}
.mon .md>b{font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mon .md.out>b{color:var(--ter)}
.mon .md.today>b{background:var(--brandFill);color:var(--brandOn);font-weight:600}
.mon .md.sel{background:var(--tint2)}
.mon .md i{display:block;font-style:normal;background:var(--cT);color:var(--cI);border-radius:3px;padding:1px 5px;font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon .md .dots{display:none;gap:3px;justify-content:center;margin-top:auto}
.mon .md .dots u{width:5px;height:5px;border-radius:50%;background:var(--cI);display:block}
.win.w0 .mon .md{min-height:46px;padding:4px;align-items:center}
.win.w0 .mon .md i{display:none}
.win.w0 .mon .md .dots{display:flex}
.agenda{display:flex;flex-direction:column}
.agenda .ag-d{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ter);padding:var(--s4) 0 var(--s2);border-bottom:1px solid var(--line)}
.agenda .ag-d:first-child{padding-top:0}
.agenda .ag{display:flex;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.agenda .ag .tm{width:64px;flex:0 0 auto;font-size:12.5px;color:var(--sec);font-variant-numeric:tabular-nums;line-height:1.5}
.agenda .ag .tm span{display:block;font-size:11.5px;color:var(--ter)}
.agenda .ag .bar{width:3px;border-radius:2px;background:var(--cI);flex:0 0 auto}
.agenda .ag .bd{flex:1;min-width:0}
.agenda .ag .bd b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.agenda .ag .bd span{font-size:12.5px;color:var(--ter)}

/* ── stepper + wizard ── */
.stp{display:flex;align-items:center;gap:0;margin-bottom:var(--s7)}
.stp .si{display:flex;align-items:center;gap:var(--s2);font-size:13px;font-weight:500;color:var(--ter);white-space:nowrap}
.stp .si .nu{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--surf);box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--ter);flex:0 0 auto;font-variant-numeric:tabular-nums}
.stp .si.done{color:var(--ink2)}
.stp .si.done .nu{background:var(--brandFill);color:var(--brandOn);box-shadow:none}
.stp .si.on{color:var(--ink);font-weight:600}
.stp .si.on .nu{box-shadow:inset 0 0 0 2px var(--brand);color:var(--brandInk)}
.stp .ln{flex:1;height:1px;background:var(--line);margin:0 var(--s3);min-width:20px}
.stp .ln.done{background:var(--brandFill)}
.stpm{display:none}
.win.w1 .stp .si .lb2{display:none}
.win.w1 .stp .si.on .lb2{display:inline}
.win.w0 .stp{display:none}
.win.w0 .stpm{display:block;margin-bottom:var(--s5)}
.stpm .t{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ter);margin-bottom:8px}
.stpm .t b{font-size:14px;color:var(--ink);font-family:var(--f-head);font-weight:600}
.stpm .pb{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.stpm .pb i{display:block;height:100%;background:var(--brandFill);border-radius:2px}
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--s8);align-items:start}
.win.w2 .wiz{grid-template-columns:minmax(0,1fr) 300px;gap:var(--s6)}
.win.w1 .wiz,.win.w0 .wiz{grid-template-columns:minmax(0,1fr)}
.wiz h2{font-family:var(--f-head);font-size:22px;font-weight:600;letter-spacing:-.018em;line-height:1.25}
.wiz .lede{font-size:14px;color:var(--sec);margin:6px 0 var(--s6);line-height:1.6;max-width:56ch}
.wiz .form{display:flex;flex-direction:column;gap:var(--s6)}
.sumcard{position:sticky;top:0;border:1px solid var(--line);border-radius:var(--r4);padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s3);background:var(--rail)}
.sumcard h3{font-family:var(--f-head);font-size:14px;font-weight:600}
.sumcard .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:var(--s3);font-weight:600}
.sumcard .tot b{font-family:var(--f-head);font-size:20px;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.win.w1 .sumcard,.win.w0 .sumcard{position:static}
.optgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.win.w0 .optgrid{grid-template-columns:minmax(0,1fr)}
.optgrid .opt{flex-direction:column;gap:var(--s2);min-height:0}

/* ── approval ── */
.req{display:flex;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s5);flex-wrap:wrap}
.req .ft{flex:1;min-width:240px}
.req h1{font-family:var(--f-head);font-size:24px;font-weight:600;letter-spacing:-.018em;line-height:1.25}
.req .sub{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;font-size:13px;color:var(--sec);margin-top:8px}
.req .amt{text-align:right}
.req .amt b{display:block;font-family:var(--f-head);font-size:28px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.1}
.req .amt span{font-size:12px;color:var(--ter)}
.win.w0 .req .amt{text-align:left;width:100%}
